schema_version: protocol-v5-resource-semantic-independence-v1.0.0
protocol_version: 5.0.0
assertion_scope: design_review_not_statistical_inference
entries:
  - {family_id: streaming_statistics, description: One-pass numeric moments., primary_kernel: online integer accumulation, data_representation: generated scalar stream, dominant_resource_mechanism: low-memory sequential compute, major_algorithmic_operation: streaming reduction, distinctness_rationale: Avoids materialized records and preserves only constant-size state., known_overlap_limitations: Shares aggregate arithmetic with grouped and rolling reductions but not their storage or access pattern.}
  - {family_id: relational_transform, description: Filter and projection on generated rows., primary_kernel: row predicate and projection, data_representation: materialized tuples, dominant_resource_mechanism: row materialization and scan, major_algorithmic_operation: relational selection/projection, distinctness_rationale: Exercises table-shaped record transformation without joining or global ordering., known_overlap_limitations: Shares row generation with join but has no build/probe index.}
  - {family_id: hash_join, description: Partial-overlap build-and-probe join., primary_kernel: hash table build and lookup, data_representation: keyed tuple relations, dominant_resource_mechanism: random-access hash state, major_algorithmic_operation: equi-join, distinctness_rationale: Requires a keyed build relation and probe phase absent from other families., known_overlap_limitations: Hash storage overlaps with deduplication but join preserves relation payload and match aggregation.}
  - {family_id: sort_group_reduction, description: Sort then aggregate groups., primary_kernel: comparison sort, data_representation: sortable key-value rows, dominant_resource_mechanism: full-order materialization, major_algorithmic_operation: ordering and grouped reduction, distinctness_rationale: Global comparison ordering distinguishes it from hash and streaming aggregation., known_overlap_limitations: Final aggregation overlaps with streaming statistics after the sort boundary.}
  - {family_id: categorical_encoding, description: Encode categorical feature cells., primary_kernel: category-to-code mapping, data_representation: dense feature buffer, dominant_resource_mechanism: dense encoded allocation, major_algorithmic_operation: categorical feature transformation, distinctness_rationale: Expands tabular features into a dense numeric representation with controlled cardinality., known_overlap_limitations: Uses lookup tables like hashing but produces a dense feature matrix.}
  - {family_id: iterative_linear_fit, description: Repeated linear parameter updates., primary_kernel: epoch-wise dot products and updates, data_representation: dense samples and weight vector, dominant_resource_mechanism: repeated arithmetic passes, major_algorithmic_operation: iterative optimization, distinctness_rationale: Stateful multi-epoch numerical optimization is absent from the single-pass families., known_overlap_limitations: Dense arithmetic overlaps with matrix computation at a lower-dimensional access pattern.}
  - {family_id: dense_matrix_computation, description: Square dense integer matrix product., primary_kernel: triple-loop matrix multiplication, data_representation: dense square matrices, dominant_resource_mechanism: compute-intensive dense reuse, major_algorithmic_operation: matrix multiplication, distinctness_rationale: Two-dimensional cubic dense computation has a distinct locality and arithmetic profile., known_overlap_limitations: Shares dense numeric storage with encoding and fitting but not their algorithms.}
  - {family_id: sparse_graph_traversal, description: Bounded breadth-first search., primary_kernel: frontier expansion, data_representation: sparse adjacency lists, dominant_resource_mechanism: irregular pointer and queue access, major_algorithmic_operation: graph reachability traversal, distinctness_rationale: Irregular topology-driven access and a frontier queue are unique in the set., known_overlap_limitations: Queue mechanics overlap with producer-consumer but traversal is single-process dependency driven.}
  - {family_id: text_tfidf, description: Document-frequency construction., primary_kernel: token counting by document, data_representation: token streams and sparse vocabulary counts, dominant_resource_mechanism: sparse lexical aggregation, major_algorithmic_operation: TF-IDF sufficient-statistic construction, distinctness_rationale: Text-document boundaries and vocabulary statistics are unique semantic structure., known_overlap_limitations: Hash counting overlaps with grouped reduction while retaining document semantics.}
  - {family_id: json_normalization, description: Parse and canonicalize nested documents., primary_kernel: serialization parsing and canonical emission, data_representation: nested JSON objects, dominant_resource_mechanism: object allocation and parsing, major_algorithmic_operation: structural normalization, distinctness_rationale: Exercises recursive structured serialization rather than numeric kernels., known_overlap_limitations: Materializes records like relational transform but with nested schema and parser costs.}
  - {family_id: image_convolution, description: Five-point raster stencil., primary_kernel: spatial neighborhood convolution, data_representation: two-dimensional grayscale raster, dominant_resource_mechanism: neighborhood memory bandwidth, major_algorithmic_operation: image filtering, distinctness_rationale: Spatial stencil dependencies distinguish it from row and matrix algebra operations., known_overlap_limitations: Dense two-dimensional storage overlaps with matrices but uses local rather than all-pairs access.}
  - {family_id: compression_roundtrip, description: Compress and exactly decompress bytes., primary_kernel: DEFLATE round-trip, data_representation: binary byte buffer, dominant_resource_mechanism: codec state and byte throughput, major_algorithmic_operation: lossless compression/decompression, distinctness_rationale: A reversible byte codec is algorithmically distinct and has an intrinsic equality invariant., known_overlap_limitations: Hashing is used only for evidence and is not the primary kernel.}
  - {family_id: rolling_timeseries, description: Fixed-window sequential aggregates., primary_kernel: sliding-window update, data_representation: ordered numeric series and ring state, dominant_resource_mechanism: window-state sequential access, major_algorithmic_operation: rolling temporal analysis, distinctness_rationale: Ordered temporal window eviction differentiates it from unordered and whole-stream reductions., known_overlap_limitations: Shares sums with streaming statistics but retains a bounded moving window.}
  - {family_id: monte_carlo, description: Fixed-seed geometric sampling., primary_kernel: pseudorandom fixed-point sampling, data_representation: generated coordinate stream, dominant_resource_mechanism: random-number arithmetic throughput, major_algorithmic_operation: Monte Carlo estimation, distinctness_rationale: Sampling-based estimation with deterministic generator state is unique among exact algorithms., known_overlap_limitations: Streams values like statistics but applies stochastic simulation semantics.}
  - {family_id: content_deduplication, description: Detect repeated content identities., primary_kernel: set membership and insertion, data_representation: content identifiers in a hash set, dominant_resource_mechanism: cardinality-dependent hash state, major_algorithmic_operation: deduplication, distinctness_rationale: Uniqueness tracking and collision-controlled cardinality differ from relational matching., known_overlap_limitations: Hash mechanics overlap with joins but has no second relation or payload matching.}
  - {family_id: bounded_producer_consumer, description: Concurrent bounded-queue processing., primary_kernel: synchronized enqueue/dequeue, data_representation: queued work items, dominant_resource_mechanism: thread coordination and bounded backpressure, major_algorithmic_operation: producer-consumer pipeline, distinctness_rationale: Concurrency synchronization and backpressure are absent from all other families., known_overlap_limitations: Queue storage overlaps with graph frontier management but adds independent producer and consumer threads.}
