schema_version: protocol-v5-resource-cluster-eligibility-v1.1.0
protocol_version: 5.0.0
expected_context: orbstack
expected_namespace: z2jh-context-demo
cluster_identity_label: {key: z2jh-context-demo.local/e4-evaluation-backend, value: orbstack-kubernetes}
namespace_safety_label: {key: z2jh-context-demo.local/e4-evaluation-backend, value: orbstack-kubernetes}
node_identity_label: {key: kubernetes.io/hostname, value: orbstack}
node_isolation_label: {key: node-role.kubernetes.io/control-plane, value: "true"}
required_node_count: 1
required_cgroup_version: v2
required_cgroup_controllers: [cpu, memory, pids]
required_cgroup_files: [cgroup.controllers, cpu.max, cpu.stat, memory.current, memory.events, memory.max, memory.peak]
required_memory_event_keys: [oom, oom_kill]
minimum_allocatable: {cpu_m: 2000, memory_mib: 2560}
maximum_trial: {cpu_m: 2000, memory_mib: 2048}
required_api_access:
  - {verb: create, resource: pods}
  - {verb: get, resource: pods}
  - {verb: list, resource: pods}
  - {verb: delete, resource: pods}
  - {verb: get, resource: pods/log}
single_active_e4_pod: true
require_no_resource_quotas: true
require_pre_pulled_image: false
require_verified_image_state: true
require_dedicated_node: false
require_no_non_daemonset_workloads_on_node: false
eligibility_probe:
  required_before_trials: true
  resource_allocation: {cpu_m: 100, memory_mib: 64}
  must_verify_cgroup_files_and_controllers: true
  must_be_cleaned_up: true
