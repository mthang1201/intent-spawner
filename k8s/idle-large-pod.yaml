apiVersion: v1
kind: Pod
metadata:
  name: idle-large-example
  labels:
    app.kubernetes.io/name: z2jh-context-demo
    demo: overprovisioning
spec:
  restartPolicy: Never
  containers:
    - name: idle
      image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["sh", "-c", "echo idle large profile; sleep infinity"]
      resources:
        requests:
          cpu: "1500m"
          memory: "1536Mi"
        limits:
          cpu: "2"
          memory: "2Gi"
