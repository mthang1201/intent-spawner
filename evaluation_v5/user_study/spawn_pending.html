{% extends "page.html" %}
{% block main %}
  <div class="container">
    <div class="row">
      <div class="text-center">
        <p>The study is checking notebook readiness.</p>
        <p>It will record readiness when available, stop the study server, and advance automatically.</p>
        <div class="progress">
          <div id="progress-bar"
               class="progress-bar"
               role="progressbar"
               aria-valuenow="0"
               aria-valuemin="0"
               aria-valuemax="100">
            <span class="sr-only"><span id="sr-progress">0%</span> Complete</span>
          </div>
        </div>
        <p id="progress-message"></p>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <details id="progress-details">
          <summary>Operational progress</summary>
          <div id="progress-log"></div>
        </details>
      </div>
    </div>
  </div>
{% endblock main %}
{% block script %}
  {{ super() }}
  <script type="text/javascript">
    require(["jquery"], function($) {
      const advanceUrl = {{ study_advance_url | tojson }};
      const evtSource = new EventSource({{ progress_url | tojson }});
      const progressMessage = $("#progress-message");
      const progressBar = $("#progress-bar");
      const srProgress = $("#sr-progress");
      const progressLog = $("#progress-log");
      let advancing = false;
      const advance = function(url) {
        if (advancing) return;
        advancing = true;
        evtSource.close();
        window.location.assign(url || advanceUrl);
      };

      evtSource.onmessage = function(e) {
        const evt = JSON.parse(e.data);
        if (evt.progress !== undefined) {
          const value = evt.progress.toString();
          progressBar.attr("aria-valuenow", value);
          srProgress.text(value + "%");
          progressBar.css("width", value + "%");
        }
        let rendered = "";
        if (evt.html_message !== undefined) {
          progressMessage.html(evt.html_message);
          rendered = evt.html_message;
        } else if (evt.message !== undefined) {
          progressMessage.text(evt.message);
          rendered = progressMessage.html();
        }
        if (rendered) {
          progressLog.append($("<div>").addClass("progress-log-event").html(rendered));
        }
        if (evt.ready) {
          advance(evt.url || advanceUrl);
        } else if (evt.failed) {
          progressBar.addClass("progress-bar-danger");
          progressMessage.text("Notebook readiness was unavailable; preserving it as missing and advancing.");
          window.setTimeout(function() { advance(advanceUrl); }, 750);
        }
      };

      // JupyterHub's configured 180-second start timeout normally produces a
      // failed progress event.  This bounded browser fallback prevents a lost
      // event stream from leaving a participant on a manual timing page.
      window.setTimeout(function() { advance(advanceUrl); }, 185000);
      window._jupyterhub_page_loaded = true;
    });
  </script>
{% endblock script %}
