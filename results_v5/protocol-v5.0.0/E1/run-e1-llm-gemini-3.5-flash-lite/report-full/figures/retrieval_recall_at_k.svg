  <text x="141.3" y="217.2" text-anchor="middle" class="val">0.427</text>
  <rect x="165.3" y="270.9" width="36.0" height="59.1" fill="#d97706" rx="3"/>
  <text x="183.3" y="264.9" text-anchor="middle" class="val">0.236</text>
