<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #475569; }
    .axis { stroke: #94a3b8; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2 2; }
    .tick { font-size: 11px; fill: #475569; }
    .label { font-size: 12px; font-weight: 600; fill: #0f172a; }
    .val { font-size: 11px; font-weight: 600; fill: #0f172a; }
    .val-light { font-size: 10px; fill: #475569; }
    .legend { font-size: 11px; fill: #0f172a; }
    .note { font-size: 10px; font-style: italic; fill: #475569; }
  </style>
  <text x="50" y="32" class="title">P2 Error Taxonomy: Earliest Causal Failure Breakdown</text>
  <text x="50" y="52" class="subtitle">Attribution of 0 failed recommendations out of 0 total evaluated attempts.</text>
  <line x1="110" y1="330" x2="700" y2="330" class="axis"/>
  <line x1="110" y1="80" x2="110" y2="330" class="axis"/>
  <line x1="110" y1="330.0" x2="700" y2="330.0" class="grid"/>
  <text x="100" y="334.0" text-anchor="end" class="tick">0</text>
  <line x1="110" y1="267.5" x2="700" y2="267.5" class="grid"/>
  <text x="100" y="271.5" text-anchor="end" class="tick">1</text>
  <line x1="110" y1="205.0" x2="700" y2="205.0" class="grid"/>
  <text x="100" y="209.0" text-anchor="end" class="tick">3</text>
  <line x1="110" y1="142.5" x2="700" y2="142.5" class="grid"/>
  <text x="100" y="146.5" text-anchor="end" class="tick">4</text>
  <line x1="110" y1="80.0" x2="700" y2="80.0" class="grid"/>
  <text x="100" y="84.0" text-anchor="end" class="tick">6</text>
  <text x="35" y="205.0" transform="rotate(-90 35 205.0)" text-anchor="middle" class="label">Failure Count</text>
  <rect x="128.1" y="330.0" width="48.0" height="0.0" fill="#7c3aed" rx="3"/>
  <text x="152.1" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="152.1" y="350" text-anchor="middle" class="label">Extraction</text>
  <rect x="212.4" y="330.0" width="48.0" height="0.0" fill="#2563eb" rx="3"/>
  <text x="236.4" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="236.4" y="350" text-anchor="middle" class="label">Retrieval</text>
  <rect x="296.7" y="330.0" width="48.0" height="0.0" fill="#d97706" rx="3"/>
  <text x="320.7" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="320.7" y="350" text-anchor="middle" class="label">Constraint</text>
  <rect x="381.0" y="330.0" width="48.0" height="0.0" fill="#e11d48" rx="3"/>
  <text x="405.0" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="405.0" y="350" text-anchor="middle" class="label">Ranking</text>
  <rect x="465.3" y="330.0" width="48.0" height="0.0" fill="#64748b" rx="3"/>
  <text x="489.3" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="489.3" y="350" text-anchor="middle" class="label">Unsupported</text>
  <rect x="549.6" y="330.0" width="48.0" height="0.0" fill="#e2e8f0" rx="3"/>
  <text x="573.6" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="573.6" y="350" text-anchor="middle" class="label">Provider</text>
  <rect x="633.9" y="330.0" width="48.0" height="0.0" fill="#475569" rx="3"/>
  <text x="657.9" y="324" text-anchor="middle" class="val-light">0</text>
  <text x="657.9" y="350" text-anchor="middle" class="label">Other</text>
  <text x="700" y="405" text-anchor="end" class="note">Earliest failed pipeline stage per failed request</text>
</svg>
