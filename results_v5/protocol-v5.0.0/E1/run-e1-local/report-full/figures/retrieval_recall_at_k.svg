<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #475569; }
    .axis { stroke: #94a3b8; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2 2; }
    .tick { font-size: 11px; fill: #475569; }
    .label { font-size: 12px; font-weight: 600; fill: #0f172a; }
    .val { font-size: 11px; font-weight: 600; fill: #0f172a; }
    .val-light { font-size: 10px; fill: #475569; }
    .legend { font-size: 11px; fill: #0f172a; }
    .note { font-size: 10px; font-style: italic; fill: #475569; }
  </style>
  <text x="50" y="32" class="title">P2 Retrieval Channel Ablation: Recall@K</text>
  <text x="50" y="52" class="subtitle">Pre-constraint retrieval recall across Sparse, Dense, and Hybrid (RRF) channels. These are P2 ablations, not primary system IDs.</text>
  <line x1="80" y1="330" x2="700" y2="330" class="axis"/>
  <line x1="80" y1="80" x2="80" y2="330" class="axis"/>
  <line x1="80" y1="330.0" x2="700" y2="330.0" class="grid"/>
