  <line x1="80" y1="130.0" x2="700" y2="130.0" class="grid"/>
  <text x="70" y="134.0" text-anchor="end" class="tick">0.8</text>
  <line x1="80" y1="80.0" x2="700" y2="80.0" class="grid"/>
  <text x="70" y="84.0" text-anchor="end" class="tick">1.0</text>
  <text x="25" y="205.0" transform="rotate(-90 25 205.0)" text-anchor="middle" class="label">Macro Recall@K</text>
  <rect x="123.3" y="211.8" width="36.0" height="118.2" fill="#2563eb" rx="3"/>
  <text x="141.3" y="205.8" text-anchor="middle" class="val">0.473</text>
  <rect x="165.3" y="249.3" width="36.0" height="80.7" fill="#d97706" rx="3"/>
  <text x="183.3" y="243.3" text-anchor="middle" class="val">0.323</text>
  <rect x="207.3" y="232.3" width="36.0" height="97.7" fill="#059669" rx="3"/>
  <text x="225.3" y="226.3" text-anchor="middle" class="val">0.391</text>
