<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #475569; }
    .axis { stroke: #94a3b8; stroke-width: 1; }
    .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2 2; }
    .tick { font-size: 11px; fill: #475569; }
    .label { font-size: 12px; font-weight: 600; fill: #0f172a; }
    .val { font-size: 11px; font-weight: 600; fill: #0f172a; }
    .val-light { font-size: 10px; fill: #475569; }
    .legend { font-size: 11px; fill: #0f172a; }
    .note { font-size: 10px; font-style: italic; fill: #475569; }
  </style>
  <text x="50" y="32" class="title">Confidence-Interval Forest Plot (P1 vs P2)</text>
  <text x="50" y="52" class="subtitle">Equal-weight family macro means with 95% bootstrap confidence intervals and paired differences.</text>
  <text x="275.0" y="73" text-anchor="middle" class="label">Absolute Estimates (0.0 to 1.0)</text>
  <text x="595.0" y="73" text-anchor="middle" class="label">Paired Difference (P2 - P1)</text>
  <line x1="140.0" y1="85" x2="140.0" y2="330" class="grid"/>
  <text x="140.0" y="346" text-anchor="middle" class="tick">0.00</text>
  <line x1="207.5" y1="85" x2="207.5" y2="330" class="grid"/>
  <text x="207.5" y="346" text-anchor="middle" class="tick">0.25</text>
  <line x1="275.0" y1="85" x2="275.0" y2="330" class="grid"/>
  <text x="275.0" y="346" text-anchor="middle" class="tick">0.50</text>
  <line x1="342.5" y1="85" x2="342.5" y2="330" class="grid"/>
  <text x="342.5" y="346" text-anchor="middle" class="tick">0.75</text>
  <line x1="410.0" y1="85" x2="410.0" y2="330" class="grid"/>
  <text x="410.0" y="346" text-anchor="middle" class="tick">1.00</text>
  <line x1="140" y1="330" x2="410" y2="330" class="axis"/>
  <line x1="480.0" y1="85" x2="480.0" y2="330" class="grid"/>
  <text x="480.0" y="346" text-anchor="middle" class="tick">-0.50</text>
  <line x1="537.5" y1="85" x2="537.5" y2="330" class="grid"/>
  <text x="537.5" y="346" text-anchor="middle" class="tick">-0.25</text>
  <line x1="595.0" y1="85" x2="595.0" y2="330" class="grid"/>
  <text x="595.0" y="346" text-anchor="middle" class="tick">+0.00</text>
  <line x1="652.5" y1="85" x2="652.5" y2="330" class="grid"/>
  <text x="652.5" y="346" text-anchor="middle" class="tick">+0.25</text>
  <line x1="710.0" y1="85" x2="710.0" y2="330" class="grid"/>
  <text x="710.0" y="346" text-anchor="middle" class="tick">+0.50</text>
  <line x1="480" y1="330" x2="710" y2="330" class="axis"/>
  <line x1="595.0" y1="85" x2="595.0" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="130" y="113.5" text-anchor="end" class="label">JointAccept@1</text>
  <line x1="233.3" y1="105.5" x2="360.9" y2="105.5" stroke="#d97706" stroke-width="2"/>
  <circle cx="302.0" cy="105.5" r="3.5" fill="#d97706"/>
  <line x1="302.0" y1="113.5" x2="375.6" y2="113.5" stroke="#2563eb" stroke-width="2"/>
  <circle cx="340.0" cy="113.5" r="3.5" fill="#2563eb"/>
  <text x="130" y="162.5" text-anchor="end" class="label">Profile Acceptable</text>
  <line x1="311.8" y1="154.5" x2="410.0" y2="154.5" stroke="#d97706" stroke-width="2"/>
  <circle cx="365.8" cy="154.5" r="3.5" fill="#d97706"/>
  <line x1="345.0" y1="162.5" x2="394.0" y2="162.5" stroke="#2563eb" stroke-width="2"/>
  <circle cx="369.5" cy="162.5" r="3.5" fill="#2563eb"/>
  <text x="130" y="211.5" text-anchor="end" class="label">Image Acceptable</text>
  <line x1="243.1" y1="203.5" x2="375.6" y2="203.5" stroke="#d97706" stroke-width="2"/>
  <circle cx="311.8" cy="203.5" r="3.5" fill="#d97706"/>
  <line x1="336.4" y1="211.5" x2="400.2" y2="211.5" stroke="#2563eb" stroke-width="2"/>
  <circle cx="370.7" cy="211.5" r="3.5" fill="#2563eb"/>
  <text x="130" y="260.5" text-anchor="end" class="label">Constraint Violations</text>
  <line x1="184.2" y1="252.5" x2="311.8" y2="252.5" stroke="#d97706" stroke-width="2"/>
  <circle cx="243.1" cy="252.5" r="3.5" fill="#d97706"/>
  <line x1="154.7" y1="260.5" x2="218.5" y2="260.5" stroke="#2563eb" stroke-width="2"/>
  <circle cx="184.2" cy="260.5" r="3.5" fill="#2563eb"/>
  <text x="130" y="309.5" text-anchor="end" class="label">Robustness (SRR)</text>
  <line x1="225.9" y1="301.5" x2="354.8" y2="301.5" stroke="#d97706" stroke-width="2"/>
  <circle cx="293.4" cy="301.5" r="3.5" fill="#d97706"/>
  <line x1="289.3" y1="309.5" x2="377.3" y2="309.5" stroke="#2563eb" stroke-width="2"/>
  <circle cx="334.3" cy="309.5" r="3.5" fill="#2563eb"/>
  <rect x="180" y="387" width="12" height="12" fill="#d97706" rx="2"/>
  <text x="198" y="397" class="legend">P1 (Rule-Based)</text>
  <rect x="310" y="387" width="12" height="12" fill="#2563eb" rx="2"/>
  <text x="328" y="397" class="legend">P2 (Structured + Hybrid)</text>
  <rect x="520" y="387" width="12" height="12" fill="#059669" rx="2"/>
  <text x="538" y="397" class="legend">Paired Difference (P2 - P1)</text>
</svg>
