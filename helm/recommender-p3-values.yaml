# P3: the frozen P2 pipeline followed by retrieval-grounded LLM reranking.
# Replace endpoint/model and create the referenced Secret. P2 algorithm
# parameters intentionally remain under the unchanged P2 configuration.
hub:
  extraEnv:
    RECOMMENDER_BACKEND: p3
    P2_STRUCTURED_EXTRACTOR: local
    P3_RERANKER_MODE: llm
    P3_TOTAL_TIMEOUT: "30"
    P3_MAX_CONCURRENT_RECOMMENDATIONS: "4"
    EXTERNAL_LLM_ENDPOINT: https://llm.example.invalid/v1/chat/completions
    EXTERNAL_LLM_MODEL: replace-with-provider-model-id
    EXTERNAL_LLM_TIMEOUT: "20"
    EXTERNAL_LLM_TOTAL_TIMEOUT: "30"
    EXTERNAL_LLM_MAX_RETRIES: "1"
    EXTERNAL_LLM_RETRY_BACKOFF_SECONDS: "0.25"
    EXTERNAL_LLM_TEMPERATURE: "0"
    EXTERNAL_LLM_ALLOW_INSECURE_HTTP: "false"
    EXTERNAL_LLM_API_KEY:
      valueFrom:
        secretKeyRef:
          name: intent-spawner-p3-reranker
          key: api-key
          optional: false
