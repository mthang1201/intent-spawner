# Task E opt-in overlay. Apply after proposed-values.yaml. The base values stay
# in Catalog Mode and are unchanged unless an administrator selects this file.
hub:
  extraEnv:
    PYTHONPATH: /opt/intent-spawner
    RESOURCE_SELECTION_MODE: dynamic
  extraVolumes:
    - name: recommender-runtime
      configMap:
        name: intent-spawner-recommender
  extraVolumeMounts:
    - name: recommender-runtime
      mountPath: /opt/intent-spawner/recommender
      readOnly: true
  extraConfig:
    01-policy-bounded-dynamic-resources: |
      import html
      import json
      import math
      import time
      import uuid

      from jupyterhub.handlers.base import BaseHandler
      from tornado import web

      from recommender.dynamic_resources import (
          CATALOG_MODE,
          DYNAMIC_MODE,
          ResourceDecision,
          ResourceSelector,
          load_resource_policy,
          resource_policy_hash,
      )

      # Invalid admin policy, GPU/image cross-policy, or an unknown mode prevents
      # Hub startup. A file update requires a Hub restart; previews are in-memory
      # and therefore cannot survive that policy generation change.
      DYNAMIC_RESOURCE_POLICY = load_resource_policy()
      DYNAMIC_RESOURCE_POLICY_HASH = resource_policy_hash(DYNAMIC_RESOURCE_POLICY)
      RESOURCE_SELECTOR = ResourceSelector(DYNAMIC_RESOURCE_POLICY)
      if not set(DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist).issubset(IMAGE_CATALOG):
          raise ValueError("dynamic GPU image allowlist contains an unknown image ID")

      DYNAMIC_PREVIEW_TTL_SECONDS = 1800
      DYNAMIC_PREVIEW_MAX_ENTRIES = 1024
      DYNAMIC_RESOURCE_PREVIEWS = {}

      def select_resource_decision(options, *, mode=None, quota_headroom=None):
          return RESOURCE_SELECTOR.select(
              recommended_profile=options.get("recommended_profile", ""),
              score=options.get("score"),
              dataset_size_gb=options.get("dataset_size_gb", 0.0),
              mode=mode,
              quota_headroom=quota_headroom,
          )

      def _normalized_dataset_size(value):
          try:
              parsed = float(value or 0)
          except (TypeError, ValueError):
              return 0.0
          return parsed if math.isfinite(parsed) and parsed >= 0 else 0.0

      def _validate_dynamic_preview_request(values):
          if not isinstance(values, dict):
              raise ValueError("dynamic preview request must be a JSON object")
          if set(values) - {"intent", "dataset_size_gb", "code_context"}:
              raise ValueError("dynamic preview request contains unsupported fields")
          intent = values.get("intent", "")
          code_context = values.get("code_context", "")
          dataset_size = values.get("dataset_size_gb", 0.0)
          if not isinstance(intent, str) or not isinstance(code_context, str):
              raise ValueError("intent and code_context must be strings")
          if not isinstance(dataset_size, (int, float, str)) or isinstance(dataset_size, bool):
              raise ValueError("dataset_size_gb must be numeric")
          try:
              parsed_dataset_size = float(dataset_size or 0)
          except (TypeError, ValueError):
              raise ValueError("dataset_size_gb must be a finite non-negative number") from None
          if not math.isfinite(parsed_dataset_size) or parsed_dataset_size < 0:
              raise ValueError("dataset_size_gb must be a finite non-negative number")
          if len(intent) > 2000 or len(code_context) > 5000:
              raise ValueError("workload context exceeds the supported preview size")
          return {
              "intent": intent,
              "dataset_size_gb": dataset_size,
              "code_context": code_context,
          }

      _base_build_preview_payload = globals().get("build_preview_payload")

      def _catalog_preview_payload(values):
          if callable(_base_build_preview_payload):
              payload = dict(_base_build_preview_payload(values))
              payload["recommendation"] = dict(payload["recommendation"])
              return payload

          recommendation = recommend_workload(
              values.get("intent", ""),
              values.get("dataset_size_gb", 0.0),
              values.get("code_context", ""),
          )
          if hasattr(recommendation, "to_unified_dict"):
              recommendation = recommendation.to_unified_dict()
          else:
              recommendation = {
                  "profile": recommendation["profile"],
                  "score": recommendation.get("score"),
                  "reasons": list(recommendation.get("profile_reasons", [])),
                  "image_id": recommendation["image_id"],
                  "image_reasons": list(recommendation.get("image_reasons", [])),
                  "policy_version": RECOMMENDATION_POLICY_VERSION,
                  "catalog_version": IMAGE_CATALOG_VERSION,
              }
          applied_profile = (
              "large" if recommendation["profile"] == "gpu_or_large"
              else recommendation["profile"]
          )
          return {
              "preview_version": PREVIEW_VERSION,
              "recommendation": recommendation,
              "applied_profile": applied_profile,
              "image_display_name": IMAGE_CATALOG[recommendation["image_id"]]["display_name"],
          }

      def _resource_decision_for_preview(payload, values):
          recommendation = payload["recommendation"]
          decision = RESOURCE_SELECTOR.select(
              recommended_profile=recommendation["profile"],
              score=recommendation.get("score"),
              dataset_size_gb=values.get("dataset_size_gb", 0.0),
          )
          if (
              decision.resources
              and decision.resources.gpu_count
              and recommendation["image_id"] not in DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist
          ):
              reason = "recommended notebook image is not approved for GPU allocation"
              decision = ResourceDecision(
                  requested_mode=decision.requested_mode,
                  applied_mode=CATALOG_MODE,
                  catalog_profile=decision.catalog_profile,
                  resources=None,
                  reasons=(
                      "Dynamic candidate was rejected; Catalog Mode was applied.",
                      reason,
                  ),
                  policy_version=decision.policy_version,
                  fallback_reason=reason,
              )
          return decision

      def build_preview_payload(values):
          """Keep re-provision callers compatible while adding visible resources."""

          checked = _validate_dynamic_preview_request(values)
          payload = _catalog_preview_payload(checked)
          payload["resource_decision"] = _resource_decision_for_preview(
              payload, checked
          ).to_dict()
          payload["dynamic_policy_hash"] = DYNAMIC_RESOURCE_POLICY_HASH
          return payload

      def _preview_expected_options(payload, values):
          recommendation = payload["recommendation"]
          expected = {
              "recommended_profile": recommendation["profile"],
              "applied_profile": payload["applied_profile"],
              "recommended_image_id": recommendation["image_id"],
              "applied_image_id": recommendation["image_id"],
              "score": recommendation.get("score"),
              "dataset_size_gb": _normalized_dataset_size(values.get("dataset_size_gb", 0.0)),
              "policy_version": recommendation.get(
                  "policy_version", RECOMMENDATION_POLICY_VERSION
              ),
              "catalog_version": recommendation.get(
                  "catalog_version", IMAGE_CATALOG_VERSION
              ),
              "profile_reasons": list(recommendation.get("reasons", [])),
              "image_reasons": list(recommendation.get("image_reasons", [])),
          }
          for key in (
              "schema_version",
              "backend_name",
              "backend_version",
          ):
              if key in recommendation:
                  option_key = {
                      "schema_version": "recommendation_schema_version",
                      "backend_name": "recommender_backend",
                      "backend_version": "recommender_version",
                  }[key]
                  expected[option_key] = recommendation[key]
          return expected

      def _purge_dynamic_previews(now):
          expired = [
              preview_id for preview_id, item in DYNAMIC_RESOURCE_PREVIEWS.items()
              if item["expires_at"] <= now
          ]
          for preview_id in expired:
              DYNAMIC_RESOURCE_PREVIEWS.pop(preview_id, None)
          while len(DYNAMIC_RESOURCE_PREVIEWS) >= DYNAMIC_PREVIEW_MAX_ENTRIES:
              oldest = min(
                  DYNAMIC_RESOURCE_PREVIEWS,
                  key=lambda key: DYNAMIC_RESOURCE_PREVIEWS[key]["issued_at"],
              )
              DYNAMIC_RESOURCE_PREVIEWS.pop(oldest, None)

      def issue_dynamic_resource_preview(username, values):
          checked = _validate_dynamic_preview_request(values)
          payload = build_preview_payload(checked)
          now = time.monotonic()
          _purge_dynamic_previews(now)
          preview_id = str(uuid.uuid4())
          DYNAMIC_RESOURCE_PREVIEWS[preview_id] = {
              "username": username,
              "event_id": str(uuid.uuid4()),
              "issued_at": now,
              "expires_at": now + DYNAMIC_PREVIEW_TTL_SECONDS,
              "policy_hash": DYNAMIC_RESOURCE_POLICY_HASH,
              "expected_options": _preview_expected_options(payload, checked),
              "resource_decision": payload["resource_decision"],
          }
          payload["dynamic_preview_id"] = preview_id
          return payload

      def validate_dynamic_resource_preview(options, username, *, consume=False):
          preview_id = options.get("dynamic_preview_id")
          if not isinstance(preview_id, str) or not preview_id:
              raise ValueError("a current server-side dynamic preview is required")
          item = DYNAMIC_RESOURCE_PREVIEWS.get(preview_id)
          if item is None:
              raise ValueError("dynamic preview is unknown or has already been used")
          if item["expires_at"] <= time.monotonic():
              DYNAMIC_RESOURCE_PREVIEWS.pop(preview_id, None)
              raise ValueError("dynamic preview expired; preview again")
          if item["username"] != username:
              raise ValueError("dynamic preview belongs to a different user")
          if item["policy_hash"] != DYNAMIC_RESOURCE_POLICY_HASH:
              raise ValueError("dynamic resource policy changed after preview; preview again")
          if options.get("event_id") != item["event_id"]:
              raise ValueError("recommendation event changed after dynamic preview; preview again")

          expected = item["expected_options"]
          for key, value in expected.items():
              if key in {"applied_profile", "applied_image_id"} and options.get(
                  "decision_action"
              ) == "override":
                  continue
              if options.get(key) != value:
                  raise ValueError("recommendation changed after dynamic preview; preview again")

          if options.get("decision_action") == "override":
              decision = ResourceDecision(
                  requested_mode=RESOURCE_SELECTOR.mode,
                  applied_mode=CATALOG_MODE,
                  catalog_profile=options["applied_profile"],
                  resources=None,
                  reasons=(
                      "Manual Override preserves the selected allowlisted catalog profile.",
                  ),
                  policy_version=DYNAMIC_RESOURCE_POLICY.policy_version,
                  fallback_reason="manual catalog override",
              )
          else:
              decision = select_resource_decision(options)
              if (
                  decision.resources
                  and decision.resources.gpu_count
                  and options.get("recommended_image_id")
                  not in DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist
              ):
                  reason = "recommended notebook image is not approved for GPU allocation"
                  decision = ResourceDecision(
                      requested_mode=decision.requested_mode,
                      applied_mode=CATALOG_MODE,
                      catalog_profile=decision.catalog_profile,
                      resources=None,
                      reasons=(
                          "Dynamic candidate was rejected; Catalog Mode was applied.",
                          reason,
                      ),
                      policy_version=decision.policy_version,
                      fallback_reason=reason,
                  )
              if decision.to_dict() != item["resource_decision"]:
                  raise ValueError("dynamic resource decision changed after preview; preview again")

          if consume:
              DYNAMIC_RESOURCE_PREVIEWS.pop(preview_id, None)
          return decision

      class DynamicResourcePreviewHandler(BaseHandler):
          """Authenticated endpoint; JupyterHub/Tornado enforces XSRF on POST."""

          @web.authenticated
          def post(self):
              try:
                  values = json.loads(self.request.body.decode("utf-8"))
                  username = self.current_user.name
                  payload = issue_dynamic_resource_preview(username, values)
              except (UnicodeDecodeError, json.JSONDecodeError, TypeError, ValueError) as exc:
                  self.set_status(400)
                  payload = {"error": str(exc)}
              except Exception:
                  self.log.error("dynamic resource preview backend failed")
                  self.set_status(503)
                  payload = {"error": "dynamic resource preview is temporarily unavailable"}
              self.set_header("Content-Type", "application/json")
              self.finish(json.dumps(payload))

      _raw_handlers = getattr(c.JupyterHub, "extra_handlers", [])
      _extra_handlers = list(_raw_handlers) if isinstance(_raw_handlers, (list, tuple)) else []
      _extra_handlers.append((r"/dynamic-resource-preview", DynamicResourcePreviewHandler))
      c.JupyterHub.extra_handlers = _extra_handlers

      _catalog_options_form = c.KubeSpawner.options_form

      async def dynamic_resource_options_form(spawner):
          rendered = _catalog_options_form(spawner)
          if hasattr(rendered, "__await__"):
              rendered = await rendered
          hidden = '<input id="dynamic_preview_id" name="dynamic_preview_id" type="hidden" value=""/>'
          anchor = '<input id="decision_action" name="decision_action" type="hidden" value=""/>'
          if anchor not in rendered:
              raise ValueError("dynamic overlay could not bind the recommendation form")
          rendered = rendered.replace(anchor, anchor + hidden, 1)
          resource_row = '<dt>Applied resources</dt><dd id="preview-dynamic-resources"></dd>'
          rendered = rendered.replace(
              '<dt>Resource profile</dt><dd id="preview-profile"></dd>',
              '<dt>Resource profile</dt><dd id="preview-profile"></dd>' + resource_row,
              1,
          )
          return rendered + r'''
          <script>
          (() => {
            const root = document.getElementById("recommendation-flow");
            const form = root.closest("form");
            const previewButton = document.getElementById("preview-recommendation");
            const previewPanel = document.getElementById("recommendation-preview");
            const confirmButton = document.getElementById("confirm-recommendation");
            const overrideSubmit = document.getElementById("submit-override");
            const action = document.getElementById("decision_action");
            const token = document.getElementById("dynamic_preview_id");
            const previewVersion = document.querySelector('input[name="preview_version"]');
            const previewError = document.getElementById("preview-error");
            const fields = ["intent", "dataset_size_gb", "code_context"].map(id => document.getElementById(id));
            const spawnIndex = window.location.pathname.indexOf("/spawn");
            const hubPrefix = spawnIndex >= 0 ? window.location.pathname.slice(0, spawnIndex) : "/hub";
            const endpoint = hubPrefix + "/dynamic-resource-preview";
            let generation = 0;

            const values = () => ({intent:fields[0].value,dataset_size_gb:fields[1].value,code_context:fields[2].value});
            function invalidate() {
              generation += 1;
              token.value = "";
              action.value = "";
              previewPanel.hidden = true;
              confirmButton.disabled = true;
              overrideSubmit.disabled = true;
              if (previewError) previewError.textContent = "";
            }
            fields.forEach(field => field.addEventListener("input", invalidate));

            previewButton.addEventListener("click", async event => {
              event.preventDefault();
              event.stopImmediatePropagation();
              invalidate();
              const requestGeneration = generation;
              previewButton.disabled = true;
              try {
                const headers = {"Content-Type":"application/json"};
                const xsrfInput = form.querySelector('input[name="_xsrf"]');
                const xsrfCookie = document.cookie.split("; ").find(item => item.startsWith("_xsrf="));
                const xsrf = xsrfInput ? xsrfInput.value : (xsrfCookie ? decodeURIComponent(xsrfCookie.slice(6)) : "");
                if (!xsrf) throw new Error("missing XSRF token; reload the page");
                headers["X-XSRFToken"] = xsrf;
                const response = await fetch(endpoint,{method:"POST",credentials:"same-origin",headers,body:JSON.stringify(values())});
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || "dynamic resource preview failed");
                if (requestGeneration !== generation) return;
                const recommendation = payload.recommendation;
                const decision = payload.resource_decision;
                token.value = payload.dynamic_preview_id;
                if (previewVersion) previewVersion.value = payload.preview_version;
                document.getElementById("preview-profile").textContent = recommendation.profile + (recommendation.profile === "gpu_or_large" ? " (catalog fallback: large)" : "");
                document.getElementById("preview-image").textContent = payload.image_display_name + " (" + recommendation.image_id + ")";
                const resources = decision.resources;
                document.getElementById("preview-dynamic-resources").textContent = resources
                  ? resources.cpu_request_millicores + "m/" + resources.cpu_limit_millicores + "m CPU, " + resources.memory_request_mib + "Mi/" + resources.memory_limit_mib + "Mi memory" + (resources.gpu_count ? ", " + resources.gpu_count + " × " + resources.gpu_resource : "")
                  : "Catalog profile " + decision.catalog_profile + (decision.fallback_reason ? " — " + decision.fallback_reason : "");
                const reasons = (recommendation.reasons || []).concat(recommendation.image_reasons || [], decision.reasons || []);
                document.getElementById("preview-reasons").replaceChildren(...reasons.map(text => {const li=document.createElement("li");li.textContent=text;return li;}));
                document.getElementById("override_profile").value = payload.applied_profile;
                document.getElementById("override_image_id").value = recommendation.image_id;
                previewPanel.hidden = false;
                confirmButton.disabled = false;
                overrideSubmit.disabled = false;
              } catch (error) {
                if (requestGeneration === generation) {
                  const message = error.message || "dynamic resource preview failed";
                  if (previewError) previewError.textContent = message;
                  else window.alert(message);
                }
              } finally {
                if (requestGeneration === generation) previewButton.disabled = false;
              }
            }, true);

            form.addEventListener("submit", event => {
              if (!token.value || !["accept","override"].includes(action.value)) {
                event.preventDefault();
                action.value = "";
                window.alert("Preview the current dynamic resources before creating the pod.");
                return;
              }
              event.stopImmediatePropagation();
            }, true);
          })();
          </script>
          '''

      c.KubeSpawner.options_form = dynamic_resource_options_form

      _catalog_options_from_form = c.KubeSpawner.options_from_form

      def dynamic_resource_options_from_form(*args, **kwargs):
          formdata = kwargs.get("formdata")
          if formdata is None:
              for arg in reversed(args):
                  if isinstance(arg, dict):
                      formdata = arg
                      break
          formdata = formdata or {}
          options = _catalog_options_from_form(*args, **kwargs)
          values = formdata.get("dynamic_preview_id", [""])
          preview_id = values[0] if isinstance(values, (list, tuple)) else values
          if isinstance(preview_id, bytes):
              preview_id = preview_id.decode("utf-8")
          options["dynamic_preview_id"] = preview_id
          item = DYNAMIC_RESOURCE_PREVIEWS.get(preview_id)
          if item is not None:
              options["event_id"] = item["event_id"]
          return options

      c.KubeSpawner.options_from_form = dynamic_resource_options_from_form
      _catalog_pre_spawn_hook = c.KubeSpawner.pre_spawn_hook

      def _spawner_username(spawner):
          user = getattr(spawner, "user", None)
          username = getattr(user, "name", None)
          if not isinstance(username, str) or not username:
              raise ValueError("dynamic resource decision is not bound to a user")
          return username

      def _clear_previous_dynamic_gpu_resources(spawner):
          names = set(DYNAMIC_RESOURCE_POLICY.gpu_resource_allowlist)
          names.update(getattr(spawner, "_intent_spawner_dynamic_gpu_resources", ()) or ())
          for attribute in ("extra_resource_guarantees", "extra_resource_limits"):
              current = dict(getattr(spawner, attribute, {}) or {})
              for name in names:
                  current.pop(name, None)
              setattr(spawner, attribute, current)
          spawner._intent_spawner_dynamic_gpu_resources = ()

      async def policy_bounded_resource_pre_spawn_hook(spawner):
          await _catalog_pre_spawn_hook(spawner)
          options = spawner.user_options or {}
          decision = validate_dynamic_resource_preview(
              options,
              _spawner_username(spawner),
              consume=True,
          )

          _clear_previous_dynamic_gpu_resources(spawner)
          if decision.applied_mode == DYNAMIC_MODE:
              # Defense in depth: validate the preview-bound candidate again in
              # the same synchronous section that assigns KubeSpawner values.
              resources = RESOURCE_SELECTOR.validate_dynamic_resources(decision.resources)
              if (
                  resources.gpu_count
                  and options["applied_image_id"] not in DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist
              ):
                  raise ValueError("applied notebook image is not approved for GPU allocation")
              generated = resources.to_kubespawner_resources()
              spawner.cpu_guarantee = generated["cpu_guarantee"]
              spawner.cpu_limit = generated["cpu_limit"]
              spawner.mem_guarantee = generated["mem_guarantee"]
              spawner.mem_limit = generated["mem_limit"]
              for attribute in ("extra_resource_guarantees", "extra_resource_limits"):
                  if attribute in generated:
                      current = dict(getattr(spawner, attribute, {}) or {})
                      current.update(generated[attribute])
                      setattr(spawner, attribute, current)
              if resources.gpu_resource:
                  spawner._intent_spawner_dynamic_gpu_resources = (resources.gpu_resource,)
          elif decision.catalog_profile != options.get("applied_profile"):
              resources = PROFILE_RESOURCES[decision.catalog_profile]
              spawner.cpu_guarantee = resources["cpu_guarantee"]
              spawner.cpu_limit = resources["cpu_limit"]
              spawner.mem_guarantee = resources["mem_guarantee"]
              spawner.mem_limit = resources["mem_limit"]

          environment = dict(spawner.environment or {})
          environment.update({
              "RESOURCE_SELECTION_MODE_REQUESTED": decision.requested_mode,
              "RESOURCE_SELECTION_MODE_APPLIED": decision.applied_mode,
              "DYNAMIC_RESOURCE_POLICY_VERSION": decision.policy_version,
              "DYNAMIC_RESOURCE_POLICY_HASH": DYNAMIC_RESOURCE_POLICY_HASH,
          })
          if decision.resources:
              environment.update({
                  "APPLIED_CPU_REQUEST_MILLICORES": str(decision.resources.cpu_request_millicores),
                  "APPLIED_CPU_LIMIT_MILLICORES": str(decision.resources.cpu_limit_millicores),
                  "APPLIED_MEMORY_REQUEST_MIB": str(decision.resources.memory_request_mib),
                  "APPLIED_MEMORY_LIMIT_MIB": str(decision.resources.memory_limit_mib),
                  "APPLIED_GPU_COUNT": str(decision.resources.gpu_count),
              })
          spawner.environment = environment

          annotations = dict(spawner.extra_annotations or {})
          annotations.update({
              "z2jh-context-demo.local/resource-mode-requested": decision.requested_mode,
              "z2jh-context-demo.local/resource-mode-applied": decision.applied_mode,
              "z2jh-context-demo.local/dynamic-policy-version": decision.policy_version,
              "z2jh-context-demo.local/dynamic-policy-hash": DYNAMIC_RESOURCE_POLICY_HASH,
          })
          if decision.fallback_reason:
              annotations["z2jh-context-demo.local/dynamic-fallback"] = decision.fallback_reason[:240]
          spawner.extra_annotations = annotations

          spawner.log.info(
              "dynamic_resource_audit=%s",
              json.dumps({
                  "event": "resource_mode_decision",
                  "event_id": options.get("event_id"),
                  "policy_hash": DYNAMIC_RESOURCE_POLICY_HASH,
                  **decision.to_dict(),
              }, sort_keys=True),
          )

      c.KubeSpawner.pre_spawn_hook = policy_bounded_resource_pre_spawn_hook
