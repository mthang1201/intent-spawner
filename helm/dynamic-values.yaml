# Opt-in Dynamic Mode. The same server-side recommendation preview token owns
# both the catalog recommendation and the bounded resource decision.
hub:
  extraEnv:
    RESOURCE_SELECTION_MODE: dynamic
  extraConfig:
    01-policy-bounded-dynamic-resources: |
      from recommender.dynamic_resources import (
          CATALOG_MODE,
          DynamicResourceSpec,
          ResourceDecision,
          ResourceSelector,
          load_resource_policy,
          resource_policy_hash,
      )

      DYNAMIC_RESOURCE_POLICY = load_resource_policy()
      DYNAMIC_RESOURCE_POLICY_HASH = resource_policy_hash(DYNAMIC_RESOURCE_POLICY)
      RESOURCE_SELECTOR = ResourceSelector(DYNAMIC_RESOURCE_POLICY, mode="dynamic")
      if not set(DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist).issubset(IMAGE_CATALOG):
          raise ValueError("dynamic GPU image allowlist contains an unknown image ID")

      RECOMMENDATION_RUNTIME.extra_generation.update({
          "resource_policy_version": DYNAMIC_RESOURCE_POLICY.policy_version,
          "resource_policy_hash": DYNAMIC_RESOURCE_POLICY_HASH,
      })

      def _dynamic_resource_enricher(record, request):
          recommendation = record["recommendation"]
          decision = RESOURCE_SELECTOR.select(
              recommended_profile=recommendation["profile"],
              score=recommendation.get("score"),
              dataset_size_gb=request.dataset_size_gb,
          )
          if (
              decision.resources
              and decision.resources.gpu_count
              and recommendation["image_id"] not in DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist
          ):
              reason = "recommended notebook image is not approved for GPU allocation"
              decision = ResourceDecision(
                  requested_mode=decision.requested_mode,
                  applied_mode=CATALOG_MODE,
                  catalog_profile=decision.catalog_profile,
                  resources=None,
                  reasons=(
                      "Dynamic candidate was rejected; Catalog Mode was applied.",
                      reason,
                  ),
                  policy_version=decision.policy_version,
                  fallback_reason=reason,
              )
          return decision.to_dict()

      def _dynamic_resource_revalidator(record):
          generation = record.get("generation", {})
          if generation.get("resource_policy_hash") != DYNAMIC_RESOURCE_POLICY_HASH:
              raise ValueError("dynamic resource policy changed after preview")
          decision = record.get("resource_decision") or {}
          resources = decision.get("resources")
          if resources:
              spec = DynamicResourceSpec(**resources)
              RESOURCE_SELECTOR.validate_dynamic_resources(spec)
              if (
                  spec.gpu_count
                  and record["recommendation"]["image_id"]
                  not in DYNAMIC_RESOURCE_POLICY.gpu_image_allowlist
              ):
                  raise ValueError("dynamic GPU image is no longer allowlisted")

      RECOMMENDATION_RUNTIME.resource_enricher = _dynamic_resource_enricher
      RECOMMENDATION_RUNTIME.resource_revalidator = _dynamic_resource_revalidator
