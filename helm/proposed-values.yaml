proxy:
  service:
    type: ClusterIP

hub:
  db:
    type: sqlite-memory
  config:
    JupyterHub:
      authenticator_class: dummy
  # The package ConfigMap and checksum/version rollout values are generated by
  # scripts/recommender_package.py and applied by install-proposed.sh.
  extraEnv:
    PYTHONPATH: /opt/intent-spawner
    RECOMMENDER_BACKEND: rule_based
  extraVolumes:
    - name: recommender-runtime
      configMap:
        name: intent-spawner-recommender
  extraVolumeMounts:
    - name: recommender-runtime
      mountPath: /opt/intent-spawner/recommender
      readOnly: true
  extraConfig:
    00-context-aware-recommender: |
      from recommender.jupyterhub_integration import install_jupyterhub

      # This validates the mounted package checksum/version and creates the
      # backend selected by RECOMMENDER_BACKEND before Hub serves traffic.
      globals().update(install_jupyterhub(c))

singleuser:
  storage:
    type: dynamic
    capacity: 1Gi
  # Safe fallback only; the confirmed allowlisted catalog reference replaces it.
  image:
    name: quay.io/jupyter/minimal-notebook
    tag: "latest@sha256:a153ceb6b41db4f86b7d7dc20c7b63d08e75e2038d5e8758b954fda50ed2e18d"
  defaultUrl: /lab

prePuller:
  hook:
    enabled: false
