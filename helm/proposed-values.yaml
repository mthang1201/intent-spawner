proxy:
  service:
    type: ClusterIP

hub:
  db:
    type: sqlite-memory
  config:
    JupyterHub:
      authenticator_class: dummy
  extraConfig:
    00-context-aware-recommender: |
      import html
      import json
      import math
      import re
      import time
      import uuid

      BaseHandler = globals().get("BaseHandler")
      if BaseHandler is None:
          try:
              from jupyterhub.handlers.base import BaseHandler
          except (ImportError, ModuleNotFoundError):
              try:
                  from tornado.web import RequestHandler as BaseHandler
              except (ImportError, ModuleNotFoundError):
                  BaseHandler = object

      web = globals().get("web")
      if web is None:
          try:
              from tornado import web
          except (ImportError, ModuleNotFoundError):
              web = None

      RECOMMENDATION_POLICY_VERSION = "resource-image-policy-v1"
      PREVIEW_VERSION = "recommendation-preview-v1"
      RECOMMENDATION_PREVIEWS = {}
      RECOMMENDATION_PREVIEW_MAX_ENTRIES = 1000
      RECOMMENDATION_PREVIEW_MAX_AGE_SECONDS = 3600
      PROFILE_RESOURCES = {
          "small": {
              "cpu_guarantee": 0.1,
              "cpu_limit": 0.5,
              "mem_guarantee": "256M",
              "mem_limit": "384M",
          },
          "medium": {
              "cpu_guarantee": 0.5,
              "cpu_limit": 1,
              "mem_guarantee": "768M",
              "mem_limit": "1G",
          },
          "large": {
              "cpu_guarantee": 1.5,
              "cpu_limit": 2,
              "mem_guarantee": "1536M",
              "mem_limit": "2G",
          },
      }

      # Administrator-owned allowlist. Add or retire images here; users can
      # never submit an arbitrary registry reference. Every reference is pinned.
      IMAGE_CATALOG_VERSION = "2026-08-06.1"
      DEFAULT_IMAGE_ID = "minimal-python"
      IMAGE_CATALOG = {
          "minimal-python": {
              "display_name": "Minimal Python",
              "reference": "quay.io/jupyter/minimal-notebook@sha256:a153ceb6b41db4f86b7d7dc20c7b63d08e75e2038d5e8758b954fda50ed2e18d",
              "description": "Lightweight Python, JupyterLab, and common command-line tools.",
              "capabilities": ["python", "jupyterlab"],
              "match_terms": [],
              "priority": 0,
          },
          "scipy-data-science": {
              "display_name": "SciPy Data Science",
              "reference": "quay.io/jupyter/scipy-notebook@sha256:1a91a693c8cb086f3607f2ed38a2743ecd53dd1dac2d3e84e6cd647b33fd2bba",
              "description": "NumPy, pandas, SciPy, scikit-learn, and visualization packages.",
              "capabilities": ["numpy", "pandas", "scipy", "scikit-learn", "visualization"],
              "match_terms": [
                  "pandas", "read_csv", "dataframe", "csv", "parquet", "train",
                  "training", "fit", ".fit(", "sklearn", "scikit-learn", "xgboost",
                  "model", "numpy", "scipy", "matplotlib", "seaborn",
              ],
              "priority": 100,
          },
          "pytorch-deep-learning": {
              "display_name": "PyTorch Deep Learning",
              "reference": "quay.io/jupyter/pytorch-notebook@sha256:69c72823a4e0dbee17114bbe44d0377bc9a39504a76f6314995f7d5bfaa98d60",
              "description": "PyTorch and CUDA user-space libraries; this demo still grants no GPU device.",
              "capabilities": ["pytorch", "cuda-userspace", "data-science"],
              "match_terms": ["torch", "pytorch", "cuda", "gpu", "deep learning", "resnet", "bert"],
              "priority": 200,
          },
          "tensorflow-deep-learning": {
              "display_name": "TensorFlow Deep Learning",
              "reference": "quay.io/jupyter/tensorflow-notebook@sha256:25ddc4f73bea5a252335775b59c0e1d4969bbf70ee78d3c6d1d9da02ce58fb68",
              "description": "TensorFlow and CUDA user-space libraries; this demo still grants no GPU device.",
              "capabilities": ["tensorflow", "keras", "cuda-userspace", "data-science"],
              "match_terms": ["tensorflow", "keras"],
              "priority": 300,
          },
      }
      _image_reference_pattern = re.compile(r"^[^\s@]+@sha256:[0-9a-f]{64}$")
      if DEFAULT_IMAGE_ID not in IMAGE_CATALOG:
          raise ValueError("default notebook image is not in the allowlist")
      for _image_id, _image_item in IMAGE_CATALOG.items():
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", _image_id):
              raise ValueError(f"invalid allowlisted notebook image ID: {_image_id!r}")
          if not _image_reference_pattern.fullmatch(_image_item["reference"]):
              raise ValueError(f"notebook image must use an immutable digest: {_image_id!r}")

      GPU_TERMS = ("torch", "tensorflow", "cuda", "gpu", "deep learning", "resnet", "bert")
      TRAINING_TERMS = ("train", "training", "fit", ".fit(", "sklearn", "scikit-learn", "xgboost", "model")
      DATA_TERMS = ("pandas", "read_csv", "dataframe", "csv", "parquet")

      def _contains_any(text, terms):
          found = []
          for term in terms:
              if term.startswith("."):
                  if term in text:
                      found.append(term)
                  continue
              pattern = r"(?<![a-z0-9_])" + re.escape(term) + r"(?![a-z0-9_])"
              if re.search(pattern, text):
                  found.append(term)
          return found

      def _coerce_dataset_size(value):
          try:
              parsed = float(value or 0)
          except (TypeError, ValueError):
              return 0.0
          return parsed if math.isfinite(parsed) and parsed >= 0 else 0.0

      def recommend_profile(intent="", dataset_size_gb=0.0, code_context=""):
          dataset_size_gb = _coerce_dataset_size(dataset_size_gb)
          text = f"{intent}\n{code_context}".lower()
          reasons = []

          gpu_hits = _contains_any(text, GPU_TERMS)
          if gpu_hits:
              return "gpu_or_large", 99, [
                  "GPU/deep-learning context detected: " + ", ".join(gpu_hits[:4]),
                  "Demo environment has no real GPU, so this maps to Large resources.",
              ]

          score = 0
          if dataset_size_gb >= 2.0:
              score += 3
              reasons.append("dataset size >= 2GB")
          elif dataset_size_gb >= 0.5:
              score += 1
              reasons.append("dataset size >= 0.5GB")

          data_hits = _contains_any(text, DATA_TERMS)
          if data_hits:
              score += 1
              reasons.append("data-processing context detected: " + ", ".join(data_hits[:4]))

          training_hits = _contains_any(text, TRAINING_TERMS)
          if training_hits:
              score += 2
              reasons.append("training/modeling context detected: " + ", ".join(training_hits[:4]))

          if score >= 3:
              return "large", score, reasons
          if score >= 1:
              return "medium", score, reasons
          reasons.append("basic/light workload context")
          return "small", score, reasons

      def recommend_image(intent="", code_context=""):
          text = f"{intent}\n{code_context}".lower()
          ranked = sorted(
              IMAGE_CATALOG.items(),
              key=lambda pair: (-pair[1]["priority"], pair[0]),
          )
          for image_id, item in ranked:
              hits = _contains_any(text, item["match_terms"])
              if hits:
                  return image_id, [
                      "image capability match: " + ", ".join(hits[:4]),
                      "selected from administrator catalog only",
                  ]
          return DEFAULT_IMAGE_ID, [
              "no specialized image signal detected",
              "selected catalog default",
          ]

      def recommend_workload(intent="", dataset_size_gb=0.0, code_context=""):
          profile, score, profile_reasons = recommend_profile(intent, dataset_size_gb, code_context)
          image_id, image_reasons = recommend_image(intent, code_context)
          return {
              "profile": profile,
              "applied_profile": "large" if profile == "gpu_or_large" else profile,
              "score": score,
              "profile_reasons": profile_reasons,
              "image_id": image_id,
              "image_reasons": image_reasons,
          }

      def safe_escape_truncate(text, max_len=240):
          escaped = html.escape(str(text or ""))
          if len(escaped) <= max_len:
              return escaped
          truncated = escaped[:max_len]
          return re.sub(r"&[a-zA-Z0-9#]*$", "", truncated)

      def safe_json_dumps(obj):
          return (
              json.dumps(obj, separators=(",", ":"))
              .replace("<", "\\u003c")
              .replace(">", "\\u003e")
              .replace("&", "\\u0026")
              .replace("'", "\\u0027")
          )

      def _spawner_username(spawner):
          user = getattr(spawner, "user", None)
          username = getattr(user, "name", None) if user else None
          if not isinstance(username, str) or not username:
              if isinstance(user, str) and user:
                  return user
              return "anonymous-user"
          return username

      def _prune_recommendation_previews():
          now = time.time()
          expired = [
              preview_id for preview_id, item in RECOMMENDATION_PREVIEWS.items()
              if now - item["issued_at"] > RECOMMENDATION_PREVIEW_MAX_AGE_SECONDS
          ]
          for preview_id in expired:
              RECOMMENDATION_PREVIEWS.pop(preview_id, None)
          while len(RECOMMENDATION_PREVIEWS) >= RECOMMENDATION_PREVIEW_MAX_ENTRIES:
              oldest = min(
                  RECOMMENDATION_PREVIEWS,
                  key=lambda key: RECOMMENDATION_PREVIEWS[key]["issued_at"],
              )
              RECOMMENDATION_PREVIEWS.pop(oldest, None)

      def create_recommendation_preview(username, intent="", dataset_size_gb=0.0, code_context=""):
          if not isinstance(username, str) or not username:
              username = "anonymous-user"
          recommendation = recommend_workload(intent, dataset_size_gb, code_context)
          _prune_recommendation_previews()
          preview_id = str(uuid.uuid4())
          item = {
              "preview_id": preview_id,
              "username": username,
              "issued_at": time.time(),
              "event_id": str(uuid.uuid4()),
              "policy_version": RECOMMENDATION_POLICY_VERSION,
              "catalog_version": IMAGE_CATALOG_VERSION,
              "recommendation": recommendation,
          }
          RECOMMENDATION_PREVIEWS[preview_id] = item
          return item

      def validate_recommendation_preview(options, username, consume=True):
          options = options or {}
          preview_id = (
              options.get("recommendation_preview_id")
              or options.get("preview_id")
              or options.get("dynamic_preview_id")
          )
          if not preview_id or not isinstance(preview_id, str):
              raise ValueError("missing or invalid recommendation preview token")
          _prune_recommendation_previews()
          if consume:
              item = RECOMMENDATION_PREVIEWS.pop(preview_id, None)
          else:
              item = RECOMMENDATION_PREVIEWS.get(preview_id)
          if item is None:
              raise ValueError("missing or invalid recommendation preview token (session may have expired or server restarted)")
          if username != "anonymous-user" and item["username"] != "anonymous-user" and item["username"] != username:
              raise ValueError("recommendation preview token is not bound to user")
          if time.time() - item["issued_at"] > RECOMMENDATION_PREVIEW_MAX_AGE_SECONDS:
              raise ValueError("expired recommendation preview token")
          if item["policy_version"] != RECOMMENDATION_POLICY_VERSION:
              raise ValueError("stale recommendation policy")
          if item["catalog_version"] != IMAGE_CATALOG_VERSION:
              raise ValueError("stale image catalog")
          return item

      if web is not None and BaseHandler is not object:
          class RecommendationPreviewHandler(BaseHandler):
              """Authenticated endpoint; JupyterHub/Tornado enforces XSRF on POST."""

              @web.authenticated
              def post(self):
                  try:
                      body = json.loads(self.request.body.decode("utf-8")) if self.request.body else {}
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      self.set_status(400)
                      self.finish(json.dumps({"error": "invalid JSON body"}))
                      return

                  username = _spawner_username(self)
                  item = create_recommendation_preview(
                      username=username,
                      intent=body.get("intent", ""),
                      dataset_size_gb=body.get("dataset_size_gb", 0.0),
                      code_context=body.get("code_context", ""),
                  )
                  self.set_header("Content-Type", "application/json")
                  self.finish(json.dumps(item))

          c.JupyterHub.extra_handlers.append(
              (r"/recommendation-preview", RecommendationPreviewHandler)
          )

      def _catalog_select_options():
          return "".join(
              '<option value="{}">{} — {}</option>'.format(
                  safe_escape_truncate(image_id),
                  safe_escape_truncate(item["display_name"]),
                  safe_escape_truncate(item["description"]),
              )
              for image_id, item in IMAGE_CATALOG.items()
          )

      async def context_options_form(spawner):
          client_catalog = {
              image_id: {
                  "display_name": item["display_name"],
                  "description": item["description"],
                  "match_terms": item["match_terms"],
                  "priority": item["priority"],
              }
              for image_id, item in IMAGE_CATALOG.items()
          }
          template = r"""
          <div id="recommendation-flow" style="max-width: 800px; margin: 0 auto; font-family: sans-serif">
            <h2>Select Notebook Workload</h2>
            <p>Describe your planned computation. The system will recommend resource limits and a container image.</p>
            <input id="decision_action" name="decision_action" type="hidden" value=""/>
            <input id="recommendation_preview_id" name="recommendation_preview_id" type="hidden" value=""/>
            <input name="preview_version" type="hidden" value="__PREVIEW_VERSION__"/>

            <label for="intent"><strong>Workload description</strong></label><br/>
            <textarea id="intent" name="intent" rows="3" style="width: 100%" placeholder="e.g. Train PyTorch model on tabular data"></textarea>

            <label for="dataset_size_gb"><strong>Estimated dataset size (GB)</strong></label><br/>
            <input id="dataset_size_gb" name="dataset_size_gb" type="number" step="0.1" min="0" value="0.0"/>

            <label for="code_context"><strong>Optional imports or code context</strong></label><br/>
            <textarea id="code_context" name="code_context" rows="4" style="width: 100%" placeholder="e.g. import torch, pandas as pd"></textarea>

            <button id="preview-recommendation" type="button" class="btn btn-primary" style="margin-top: 0.5rem">Preview recommendation</button>

            <section id="recommendation-preview" hidden style="margin-top: 1rem; padding: 1rem; border: 1px solid #bbb; border-radius: 4px">
              <h3 style="margin-top: 0">Recommendation Preview</h3>
              <dl>
                <dt>Resource profile</dt><dd id="preview-profile"></dd>
                <dt>Notebook image</dt><dd id="preview-image"></dd>
                <dt>Explanation</dt><dd><ul id="preview-reasons"></ul></dd>
              </dl>
              <p><small>Image catalog: __CATALOG_VERSION__. No image is built from user input.</small></p>
              <button id="confirm-recommendation" data-recommendation-submit="true" type="submit" class="btn btn-success" disabled>Confirm recommendation</button>
              <button id="edit-recommendation" type="button" class="btn btn-default">Edit inputs</button>
              <button id="manual-override" type="button" class="btn btn-warning">Manual Override</button>
            </section>

            <section id="override-panel" hidden style="margin-top: 1rem; padding: 1rem; border-left: 4px solid #e99002">
              <h4>Manual Override</h4>
              <p>Select only administrator-approved resources and images. The override action and changed fields are logged.</p>
              <label for="override_profile"><strong>Resource profile</strong></label>
              <select id="override_profile" name="override_profile">
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
              </select>
              <br/><br/>
              <label for="override_image_id"><strong>Notebook image</strong></label>
              <select id="override_image_id" name="override_image_id">__IMAGE_OPTIONS__</select>
              <br/><br/>
              <button id="submit-override" data-recommendation-submit="true" type="submit" class="btn btn-warning" disabled>Confirm override</button>
              <button id="cancel-override" type="button" class="btn btn-default">Cancel override</button>
            </section>
          </div>
          <script>
          (() => {
            const root = document.getElementById("recommendation-flow");
            const form = root.closest("form");
            const catalog = __CLIENT_CATALOG__;
            const defaultImage = __DEFAULT_IMAGE__;
            const gpuTerms = __GPU_TERMS__;
            const trainingTerms = __TRAINING_TERMS__;
            const dataTerms = __DATA_TERMS__;
            let previewFingerprint = null;
            let currentRecommendation = null;

            const intent = document.getElementById("intent");
            const dataset = document.getElementById("dataset_size_gb");
            const code = document.getElementById("code_context");
            const action = document.getElementById("decision_action");
            const preview = document.getElementById("recommendation-preview");
            const overridePanel = document.getElementById("override-panel");
            const confirmButton = document.getElementById("confirm-recommendation");
            const overrideSubmit = document.getElementById("submit-override");
            const overrideProfile = document.getElementById("override_profile");
            const overrideImage = document.getElementById("override_image_id");

            const values = () => ({
              intent: intent.value,
              dataset_size_gb: dataset.value,
              code_context: code.value,
            });
            const fingerprint = () => JSON.stringify(values());
            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const hits = (text, terms) => terms.filter(term => {
              if (term.startswith(".")) return text.includes(term);
              return new RegExp("(^|[^a-z0-9_])" + escapeRegex(term) + "($|[^a-z0-9_])").test(text);
            });

            function recommendResource(text, size) {
              const gpuHits = hits(text, gpuTerms);
              if (gpuHits.length) return {
                profile: "gpu_or_large",
                applied_profile: "large",
                reasons: [
                  "GPU/deep-learning context detected: " + gpuHits.slice(0, 4).join(", "),
                  "Demo environment has no real GPU, so this maps to Large resources.",
                ],
              };
              let score = 0;
              const reasons = [];
              if (size >= 2) { score += 3; reasons.push("dataset size >= 2GB"); }
              else if (size >= 0.5) { score += 1; reasons.push("dataset size >= 0.5GB"); }
              const dataHits = hits(text, dataTerms);
              if (dataHits.length) { score += 1; reasons.push("data-processing context detected: " + dataHits.slice(0, 4).join(", ")); }
              const trainingHits = hits(text, trainingTerms);
              if (trainingHits.length) { score += 2; reasons.push("training/modeling context detected: " + trainingHits.slice(0, 4).join(", ")); }
              if (!score) reasons.push("basic/light workload context");
              const profile = score >= 3 ? "large" : (score >= 1 ? "medium" : "small");
              return {profile, applied_profile: profile, reasons};
            }

            function recommendImage(text) {
              const ranked = Object.entries(catalog).sort((a, b) => b[1].priority - a[1].priority || a[0].localeCompare(b[0]));
              for (const [imageId, item] of ranked) {
                const matched = hits(text, item.match_terms);
                if (matched.length) return {
                  image_id: imageId,
                  reasons: ["image capability match: " + matched.slice(0, 4).join(", "), "selected from administrator catalog only"],
                };
              }
              return {image_id: defaultImage, reasons: ["no specialized image signal detected", "selected catalog default"]};
            }

            function invalidatePreview() {
              previewFingerprint = null;
              currentRecommendation = null;
              action.value = "";
              preview.hidden = true;
              overridePanel.hidden = true;
              confirmButton.disabled = true;
              overrideSubmit.disabled = true;
            }

            [intent, dataset, code].forEach(field => field.addEventListener("input", invalidatePreview));
            document.getElementById("preview-recommendation").addEventListener("click", () => {
              const input = values();
              const text = (input.intent + "\n" + input.code_context).toLowerCase();
              const parsed = Number.parseFloat(input.dataset_size_gb);
              const size = Number.isFinite(parsed) && parsed >= 0 ? parsed : 0;
              const resource = recommendResource(text, size);
              const image = recommendImage(text);
              currentRecommendation = {...resource, ...image};
              previewFingerprint = fingerprint();
              document.getElementById("preview-profile").textContent = resource.profile + (resource.profile === "gpu_or_large" ? " (applied as large)" : "");
              document.getElementById("preview-image").textContent = catalog[image.image_id].display_name + " (" + image.image_id + ")";
              const list = document.getElementById("preview-reasons");
              list.replaceChildren(...resource.reasons.concat(image.reasons).map(reason => {
                const item = document.createElement("li"); item.textContent = reason; return item;
              }));
              overrideProfile.value = resource.applied_profile;
              overrideImage.value = image.image_id;
              preview.hidden = false;
              overridePanel.hidden = true;
              confirmButton.disabled = false;
              overrideSubmit.disabled = false;
            });

            document.getElementById("edit-recommendation").addEventListener("click", () => { invalidatePreview(); intent.focus(); });
            document.getElementById("manual-override").addEventListener("click", () => { overridePanel.hidden = false; });
            document.getElementById("cancel-override").addEventListener("click", () => { overridePanel.hidden = true; });
            confirmButton.addEventListener("click", () => { action.value = "accept"; });
            overrideSubmit.addEventListener("click", () => { action.value = "override"; });

            form.addEventListener("submit", event => {
              if (!previewFingerprint || previewFingerprint !== fingerprint() || !["accept", "override"].includes(action.value)) {
                event.preventDefault();
                action.value = "";
                window.alert("Preview the current inputs and choose Confirm or Manual Override before creating the pod.");
              }
            });
            const hideNativeSubmit = () => {
              form.querySelectorAll('input[type="submit"],button[type="submit"]').forEach(button => {
                if (!button.dataset.recommendationSubmit) button.style.display = "none";
              });
            };
            hideNativeSubmit();
            document.addEventListener("DOMContentLoaded", hideNativeSubmit, {once: true});
          })();
          </script>
          """
          replacements = {
              "__PREVIEW_VERSION__": safe_escape_truncate(PREVIEW_VERSION),
              "__CATALOG_VERSION__": safe_escape_truncate(IMAGE_CATALOG_VERSION),
              "__IMAGE_OPTIONS__": _catalog_select_options(),
              "__CLIENT_CATALOG__": safe_json_dumps(client_catalog),
              "__DEFAULT_IMAGE__": safe_json_dumps(DEFAULT_IMAGE_ID),
              "__GPU_TERMS__": safe_json_dumps(GPU_TERMS),
              "__TRAINING_TERMS__": safe_json_dumps(TRAINING_TERMS),
              "__DATA_TERMS__": safe_json_dumps(DATA_TERMS),
          }
          for placeholder, value in replacements.items():
              template = template.replace(placeholder, value)
          return template

      def context_options_from_form(*args, **kwargs):
          spawner = args[0] if args and not isinstance(args[0], dict) else None
          formdata = kwargs.get("formdata")
          if formdata is None:
              for arg in reversed(args):
                  if isinstance(arg, dict):
                      formdata = arg
                      break
          if formdata is None:
              formdata = {}

          def first(name, default=""):
              values = formdata.get(name, [default])
              value = values[0] if isinstance(values, (list, tuple)) else values
              return value.decode("utf-8") if isinstance(value, bytes) else value

          if first("preview_version") and first("preview_version") != PREVIEW_VERSION:
              raise ValueError("stale preview version")

          decision_action = first("decision_action")
          if decision_action not in {"accept", "override"}:
              raise ValueError("confirm the recommendation or submit a manual override")

          preview_id = first("recommendation_preview_id") or first("preview_id")
          preview_item = RECOMMENDATION_PREVIEWS.get(preview_id)
          if preview_item is None:
              username = _spawner_username(spawner) if spawner else "anonymous-user"
              intent = first("intent")
              code_context = first("code_context")
              if len(intent) > 2000 or len(code_context) > 5000:
                  raise ValueError("workload context exceeds the supported preview size")
              dataset_size_gb = _coerce_dataset_size(first("dataset_size_gb", "0"))
              preview_item = create_recommendation_preview(
                  username=username,
                  intent=intent,
                  dataset_size_gb=dataset_size_gb,
                  code_context=code_context,
              )
              preview_id = preview_item["preview_id"]

          rec = preview_item["recommendation"]
          applied_profile = first("override_profile") if decision_action == "override" else rec["applied_profile"]
          applied_image_id = first("override_image_id") if decision_action == "override" else rec["image_id"]
          if decision_action == "override":
              if applied_profile not in PROFILE_RESOURCES:
                  raise ValueError("manual profile override is not allowlisted")
              if applied_image_id not in IMAGE_CATALOG:
                  raise ValueError("manual image override is not allowlisted")

          res = {
              "recommendation_preview_id": preview_id,
              "decision_action": decision_action,
              "event_id": preview_item["event_id"],
              "recommended_profile": rec["profile"],
              "applied_profile": applied_profile,
              "recommended_image_id": rec["image_id"],
              "applied_image_id": applied_image_id,
              "profile_reasons": rec["profile_reasons"],
              "image_reasons": rec["image_reasons"],
              "score": rec["score"],
              "policy_version": RECOMMENDATION_POLICY_VERSION,
              "catalog_version": IMAGE_CATALOG_VERSION,
          }
          if decision_action == "override":
              res["override_profile"] = applied_profile
              res["override_image_id"] = applied_image_id

          return res

      async def context_pre_spawn_hook(spawner):
          options = spawner.user_options or {}
          username = _spawner_username(spawner)
          preview_item = validate_recommendation_preview(options, username, consume=True)

          decision_action = options.get("decision_action")
          if decision_action not in {"accept", "override"}:
              raise ValueError("invalid recommendation decision action")

          rec = preview_item["recommendation"]
          recommended_profile = rec["profile"]
          recommended_image_id = rec["image_id"]
          profile_reasons = rec["profile_reasons"]
          image_reasons = rec["image_reasons"]

          if decision_action == "override":
              applied_profile = options.get("override_profile") or options.get("applied_profile")
              applied_image_id = options.get("override_image_id") or options.get("applied_image_id")
              if applied_profile not in PROFILE_RESOURCES:
                  raise ValueError("applied profile is not allowlisted")
              if applied_image_id not in IMAGE_CATALOG:
                  raise ValueError("applied image is not allowlisted")
          else:
              applied_profile = rec["applied_profile"]
              applied_image_id = rec["image_id"]

          resources = PROFILE_RESOURCES[applied_profile]
          spawner.cpu_guarantee = resources["cpu_guarantee"]
          spawner.cpu_limit = resources["cpu_limit"]
          spawner.mem_guarantee = resources["mem_guarantee"]
          spawner.mem_limit = resources["mem_limit"]
          spawner.image = IMAGE_CATALOG[applied_image_id]["reference"]

          all_reasons = profile_reasons + image_reasons
          reason_text = "; ".join(all_reasons)
          environment = dict(spawner.environment or {})
          environment.update({
              "RECOMMENDATION_ACTION": decision_action,
              "RECOMMENDATION_EVENT_ID": preview_item["event_id"],
              "RECOMMENDED_PROFILE": recommended_profile,
              "APPLIED_PROFILE": applied_profile,
              "RECOMMENDED_NOTEBOOK_IMAGE": recommended_image_id,
              "APPLIED_NOTEBOOK_IMAGE": applied_image_id,
              "RECOMMENDATION_REASONS": reason_text,
              "IMAGE_CATALOG_VERSION": IMAGE_CATALOG_VERSION,
          })
          spawner.environment = environment

          annotations = dict(spawner.extra_annotations or {})
          annotations.update({
              "z2jh-context-demo.local/recommendation-action": decision_action,
              "z2jh-context-demo.local/recommendation-event-id": preview_item["event_id"],
              "z2jh-context-demo.local/recommended-profile": recommended_profile,
              "z2jh-context-demo.local/applied-profile": applied_profile,
              "z2jh-context-demo.local/recommended-image": recommended_image_id,
              "z2jh-context-demo.local/applied-image": applied_image_id,
              "z2jh-context-demo.local/catalog-version": IMAGE_CATALOG_VERSION,
              "z2jh-context-demo.local/recommendation-reasons": safe_escape_truncate(reason_text, 240),
          })
          spawner.extra_annotations = annotations

          audit_event = {
              "event": "recommendation_decision",
              "event_id": preview_item["event_id"],
              "action": decision_action,
              "recommended_profile": recommended_profile,
              "applied_profile": applied_profile,
              "recommended_image_id": recommended_image_id,
              "applied_image_id": applied_image_id,
              "profile_overridden": recommended_profile not in {
                  applied_profile,
                  "gpu_or_large" if applied_profile == "large" else "",
              },
              "image_overridden": recommended_image_id != applied_image_id,
              "score": rec.get("score", 0),
              "policy_version": RECOMMENDATION_POLICY_VERSION,
              "catalog_version": IMAGE_CATALOG_VERSION,
          }
          spawner.log.info("recommendation_audit=%s", json.dumps(audit_event, sort_keys=True))

      c.KubeSpawner.options_form = context_options_form
      c.KubeSpawner.options_from_form = context_options_from_form
      c.KubeSpawner.pre_spawn_hook = context_pre_spawn_hook

singleuser:
  storage:
    type: none
    extraVolumes:
      - name: demo-workload
        configMap:
          name: demo-workload
          defaultMode: 493
    extraVolumeMounts:
      - name: demo-workload
        mountPath: /home/jovyan/demo/workload
        readOnly: true
  # Safe fallback only; the confirmed allowlisted catalog reference replaces it.
  image:
    name: quay.io/jupyter/minimal-notebook
    tag: "latest@sha256:a153ceb6b41db4f86b7d7dc20c7b63d08e75e2038d5e8758b954fda50ed2e18d"
  defaultUrl: /lab

prePuller:
  hook:
    enabled: false
