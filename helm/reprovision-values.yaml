# Intent-aware replacement pod flow. It reuses the same one-time recommendation
# preview record as initial spawn and leaves the per-user PVC intact.
hub:
  extraConfig:
    10-intent-aware-reprovisioning: |
      import asyncio
      import json

      from jupyterhub.handlers.base import BaseHandler
      from tornado import web

      REPROVISION_PREVIEW_VERSION = "intent-reprovision-preview-v2"
      REPROVISION_TASKS = {}
      REPROVISION_STATES = {}
      REPROVISION_WARNINGS = [
          "The running notebook pod stops before the replacement pod starts.",
          "Kernel variables, active computations, terminals, and other in-memory state are lost.",
          "This artifact does not provide live migration or kernel checkpoint/restore.",
          "Files saved under /home/jovyan remain on the same PersistentVolumeClaim.",
      ]

      def _current_reprovision_state(user):
          options = dict(getattr(user.spawner, "user_options", {}) or {})
          return {
              "event_id": options.get("event_id", ""),
              "applied_profile": options.get("applied_profile", "unknown"),
              "applied_image_id": options.get("applied_image_id", "unknown"),
              "generation": int(options.get("reprovision_generation", 0) or 0),
          }

      async def build_reprovision_preview(user, values):
          current = _current_reprovision_state(user)
          recommendation_preview = await RECOMMENDATION_RUNTIME.issue(user.name, values)
          recommendation = recommendation_preview["recommendation"]
          proposed = {
              "recommendation_preview_id": recommendation_preview["recommendation_preview_id"],
              "recommended_profile": recommendation["profile"],
              "applied_profile": recommendation_preview["applied_profile"],
              "recommended_image_id": recommendation["image_id"],
              "image_display_name": recommendation_preview["image_display_name"],
              "backend_name": recommendation["backend_name"],
              "backend_version": recommendation["backend_version"],
              "policy_version": recommendation["policy_version"],
              "catalog_version": recommendation["catalog_version"],
              "reasons": recommendation["reasons"] + recommendation["image_reasons"],
          }
          if "resource_decision" in recommendation_preview:
              proposed["resource_decision"] = recommendation_preview["resource_decision"]
          return {
              "preview_version": REPROVISION_PREVIEW_VERSION,
              "current": current,
              "proposed": proposed,
              "persistence": {
                  "home_volume_retained": True,
                  "kernel_state_retained": False,
                  "live_migration": False,
              },
              "warnings": list(REPROVISION_WARNINGS),
          }

      def build_reprovision_options(user, values):
          if not isinstance(values, dict):
              raise ValueError("re-provision request must be a JSON object")
          allowed = {
              "acknowledge_restart", "preview_version",
              "recommendation_preview_id", "expected_current_event_id",
          }
          if set(values) - allowed:
              raise ValueError("re-provision request contains unsupported fields")
          if values.get("preview_version") != REPROVISION_PREVIEW_VERSION:
              raise ValueError("a current re-provision preview is required")
          if values.get("acknowledge_restart") is not True:
              raise ValueError("restart and kernel-state loss must be acknowledged")
          current = _current_reprovision_state(user)
          if values.get("expected_current_event_id", "") != current["event_id"]:
              raise ValueError("running server changed after preview; preview again")

          preview_id = values.get("recommendation_preview_id")
          RECOMMENDATION_RUNTIME.validate(preview_id, user.name, consume=False)
          options = RECOMMENDATION_RUNTIME.options_from_form(
              user.spawner,
              {
                  "preview_version": [PREVIEW_VERSION],
                  "decision_action": ["accept"],
                  "recommendation_preview_id": [preview_id],
              },
          )
          options.update({
              "provisioning_mode": "reprovision",
              "reprovision_generation": current["generation"] + 1,
              "previous_event_id": current["event_id"],
          })
          return options

      async def run_reprovision(handler, user, options):
          old_spawner = user.spawner
          if not old_spawner.ready or old_spawner.pending:
              raise RuntimeError("the current server is not ready for re-provisioning")
          if bool(getattr(old_spawner, "delete_pvc", False)):
              raise RuntimeError("PVC deletion must be disabled for re-provisioning")
          old_pvc_name = getattr(old_spawner, "pvc_name", None)
          REPROVISION_STATES[user.name] = "STOPPING"
          try:
              stop_future = await handler.stop_single_user(user)
              timeout = float(getattr(old_spawner, "slow_stop_timeout", 10) or 10) + 20.0
              if stop_future is not None:
                  await asyncio.wait_for(stop_future, timeout=timeout)
              deadline = asyncio.get_running_loop().time() + timeout
              while await old_spawner.poll() is None:
                  if asyncio.get_running_loop().time() >= deadline:
                      raise RuntimeError("old notebook pod did not stop within the expected timeout")
                  await asyncio.sleep(0.1)

              if old_pvc_name and getattr(user.spawner, "pvc_name", old_pvc_name) != old_pvc_name:
                  raise RuntimeError("re-provisioning changed the per-user PVC identity")
              REPROVISION_STATES[user.name] = "SPAWNING"
              await handler.spawn_single_user(user, options=options)
              REPROVISION_STATES[user.name] = "COMPLETED"
              handler.log.info(
                  "reprovision_audit=%s",
                  json.dumps({
                      "event": "reprovision_completed",
                      "event_id": options["event_id"],
                      "generation": options["reprovision_generation"],
                      "backend": options["recommender_backend"],
                      "backend_version": options["recommender_version"],
                      "profile": options["applied_profile"],
                      "image_id": options["applied_image_id"],
                      "policy_version": options["policy_version"],
                      "catalog_version": options["catalog_version"],
                      "package_version": options["package_version"],
                      "package_checksum": options["package_checksum"],
                      "home_volume_retained": True,
                  }, sort_keys=True),
              )
          except Exception:
              REPROVISION_STATES[user.name] = "FAILED"
              raise

      def _task_done(username, task, log):
          REPROVISION_TASKS.pop(username, None)
          try:
              task.result()
          except Exception:
              log.exception("intent-aware re-provisioning failed for user %s", username)

      def _reprovision_page(xsrf_token, endpoint):
          return """<!doctype html><html lang="en"><head><meta charset="utf-8"/>
          <title>Change notebook workload</title></head><body style="max-width:880px;margin:2rem auto;font-family:sans-serif">
          <main><h1>Change notebook workload</h1>
          <textarea id="intent" maxlength="2000" rows="3" style="width:100%" placeholder="New workload intent"></textarea>
          <input id="dataset" type="number" min="0" step="0.1" value="0.1"/>
          <textarea id="code" maxlength="5000" rows="5" style="width:100%" placeholder="Optional code context"></textarea>
          <button id="preview">Preview replacement</button><p id="error" role="alert"></p>
          <section id="result" hidden><p id="summary"></p><ul id="warnings"></ul>
          <label><input id="ack" type="checkbox"/> I saved my files and accept loss of kernel state.</label>
          <button id="confirm" disabled>Stop old pod and create replacement</button></section></main>
          <script>(()=>{const endpoint=__ENDPOINT__,xsrf=__XSRF__,result=document.getElementById("result"),ack=document.getElementById("ack"),confirm=document.getElementById("confirm"),error=document.getElementById("error");let preview=null;
          const context=()=>({intent:document.getElementById("intent").value,dataset_size_gb:document.getElementById("dataset").value,code_context:document.getElementById("code").value});
          const request=async body=>{const response=await fetch(endpoint,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-XSRFToken":xsrf},body:JSON.stringify(body)}),payload=await response.json();if(!response.ok)throw new Error(payload.error||"request failed");return payload;};
          document.getElementById("preview").onclick=async()=>{try{preview=await request({action:"preview",...context()});const p=preview.proposed;document.getElementById("summary").textContent=p.applied_profile+" / "+p.recommended_image_id+" via "+p.backend_name;document.getElementById("warnings").replaceChildren(...preview.warnings.map(v=>{const li=document.createElement("li");li.textContent=v;return li;}));result.hidden=false;}catch(e){error.textContent=e.message;}};
          ack.onchange=()=>{confirm.disabled=!ack.checked||!preview;};confirm.onclick=async()=>{confirm.disabled=true;try{const response=await request({action:"accept",acknowledge_restart:true,preview_version:preview.preview_version,recommendation_preview_id:preview.proposed.recommendation_preview_id,expected_current_event_id:preview.current.event_id});window.location.assign(response.progress_url);}catch(e){error.textContent=e.message;confirm.disabled=false;}};})();</script></body></html>""".replace("__ENDPOINT__", safe_json_dumps(endpoint)).replace("__XSRF__", safe_json_dumps(xsrf_token))

      class IntentReprovisionHandler(BaseHandler):
          @web.authenticated
          async def get(self):
              if not self.current_user.running:
                  raise web.HTTPError(409, "start a notebook server before re-provisioning")
              token = self.xsrf_token.decode("ascii") if isinstance(self.xsrf_token, bytes) else str(self.xsrf_token)
              self.finish(_reprovision_page(token, self.hub.base_url.rstrip("/") + "/reprovision"))

          @web.authenticated
          async def post(self):
              user = self.current_user
              try:
                  if not user.running:
                      raise RuntimeError("no running notebook server")
                  values = json.loads(self.request.body.decode("utf-8"))
                  action = values.pop("action", "")
                  if action == "preview":
                      payload = await build_reprovision_preview(user, values)
                  elif action == "accept":
                      if user.name in REPROVISION_TASKS or user.spawner.pending:
                          raise RuntimeError("a server transition is already in progress")
                      options = build_reprovision_options(user, values)
                      task = asyncio.create_task(run_reprovision(self, user, options))
                      REPROVISION_TASKS[user.name] = task
                      task.add_done_callback(lambda done, name=user.name, log=self.log: _task_done(name, done, log))
                      payload = {"status": "accepted", "event_id": options["event_id"], "progress_url": self.hub.base_url.rstrip("/") + "/spawn-pending/" + user.escaped_name}
                      self.set_status(202)
                  else:
                      raise ValueError("unsupported re-provision action")
              except (UnicodeDecodeError, json.JSONDecodeError, TypeError, ValueError) as exc:
                  self.set_status(400); payload = {"error": str(exc)}
              except RuntimeError as exc:
                  self.set_status(409); payload = {"error": str(exc)}
              except Exception:
                  self.log.exception("re-provision request failed")
                  self.set_status(503); payload = {"error": "re-provisioning is temporarily unavailable"}
              self.set_header("Content-Type", "application/json")
              self.finish(json.dumps(payload))

      c.JupyterHub.extra_handlers.append((r"/reprovision", IntentReprovisionHandler))

      # KubeSpawner 7 defaults delete_pvc to true for named PVC storage. The
      # replacement flow is only safe when the claim survives stop/create.
      c.KubeSpawner.delete_pvc = False

singleuser:
  storage:
    type: dynamic
    capacity: 1Gi
