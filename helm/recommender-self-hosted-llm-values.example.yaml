# Safe unauthenticated example. The endpoint is an existing operator-managed
# service; this repository does not deploy inference or provision GPUs.
hub:
  extraEnv:
    RECOMMENDER_BACKEND: self_hosted_llm
    SELF_HOSTED_LLM_ENDPOINT: https://inference.example.invalid/v1/chat/completions
    SELF_HOSTED_LLM_MODEL: replace-with-served-model-id
    SELF_HOSTED_LLM_TIMEOUT: "10"
    SELF_HOSTED_LLM_TOTAL_TIMEOUT: "30"
    SELF_HOSTED_LLM_MAX_RETRIES: "2"
    SELF_HOSTED_LLM_RETRY_BACKOFF_SECONDS: "0.25"
    SELF_HOSTED_LLM_TEMPERATURE: "0"
    SELF_HOSTED_LLM_MAX_CONCURRENT_RECOMMENDATIONS: "4"
    SELF_HOSTED_LLM_ALLOW_INSECURE_HTTP: "false"
    SELF_HOSTED_LLM_AUTH_REQUIRED: "false"
