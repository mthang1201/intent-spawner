schema_version: intent-gold-v4.0.0
dataset_id: intent-gold-en-vi-2026-08-08
label_policy_version: operational-gold-policy-v1
frozen_at_utc: "2026-08-08T00:00:00Z"
description: >-
  Synthetic, family-grouped workload intents for profile and notebook-image
  recommendation. Labels are protocol-locked operational targets derived from
  controlled workload specifications, resource-envelope bands, administrator
  image capabilities, and explicit policy constraints. They are not user
  preference labels or production traces.
license: synthetic-authored-for-this-repository
profile_order: [small, medium, large]
image_catalog:
  catalog_version: "2026-08-06.1"
  source_path: recommender/image-catalog.yaml
  source_sha256: f45b04efc2ea6f271d49c6806b58bfc0f30503cb68944930609f6e0f71882a71
  images:
    minimal-python:
      capabilities: [python, jupyterlab]
    scipy-data-science:
      capabilities: [numpy, pandas, scipy, scikit-learn, visualization]
    pytorch-deep-learning:
      capabilities: [pytorch, cuda-userspace, data-science]
    tensorflow-deep-learning:
      capabilities: [tensorflow, keras, cuda-userspace, data-science]

# Only these families have a frozen bounded executable analogue in protocol v3.
# The full 20-family test split is used for offline recommendation quality; this
# subset is the paired Kubernetes system-effectiveness block.
