schema_version: "1.0"
description: "Deterministic synthetic benchmark scenarios for static/manual, intent-only, and context-aware resource-profile selection."
profile_labels:
  - small
  - medium
  - large
  - gpu_or_large
categories:
  - light
  - data_processing
  - machine_learning
  - boundary
  - conflicting_signal
  - policy
thresholds:
  dataset_size_gb:
    medium_signal_min: 0.5
    large_signal_min: 2.0
  recommender_score:
    medium_min: 1
    large_min: 3
  scale_values:
    - tiny
    - small
    - medium
    - large
    - boundary_below
    - boundary_above
    - memory_pressure
synthetic_data_declaration: "All benchmark data is generated deterministically from the listed seed. No external data is downloaded, no user data is read, and generated temporary CSV files are deleted before the workload exits."
workloads:
  - workload_id: light_basic_python
    category: light
    coverage_tags:
      - light.basic_python
      - manual_profile.small_static_baseline
    description: "Small CPU and memory footprint Python arithmetic over generated numeric values."
    intent: "I just need to run a few basic Python cells and sanity-check calculations."
    dataset_size_hint_gb: 0.01
    code_context_hints:
      - "print('hello')"
      - "sum(value * value for value in values)"
    deterministic_seed: 1101
    workload:
      script: benchmarks/workload_runner.py
      operation: basic_python
      scale: tiny
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - light_basic_python
        - --scale
        - tiny
        - --seed
        - "1101"
    timeout_seconds: 30
    expected_acceptable_profiles:
      - small
    expected_recommender_profiles:
      - small
    expected_classification_reason: "No data-processing, model-training, GPU, or threshold-crossing signal is present."
    expected_pressure_type: low_cpu_low_memory
    data_source:
      type: synthetic
      generated_shape: "4,000 numeric values at dry-run scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: light_small_csv_read
    category: light
    coverage_tags:
      - light.small_csv_read
      - context.csv_signal_low_scale
    description: "Read a tiny generated CSV and compute column sums."
    intent: "Open a small CSV file and inspect a few columns."
    dataset_size_hint_gb: 0.04
    code_context_hints:
      - "import pandas as pd"
      - "pd.read_csv('small.csv')"
    deterministic_seed: 1102
    workload:
      script: benchmarks/workload_runner.py
      operation: csv_read
      scale: tiny
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - light_small_csv_read
        - --scale
        - tiny
        - --seed
        - "1102"
    timeout_seconds: 30
    expected_acceptable_profiles:
      - small
      - medium
    expected_recommender_profiles:
      - medium
    expected_classification_reason: "The workload is light in practice, but CSV/pandas context can reasonably move intent-only or context-aware systems to Medium."
    expected_pressure_type: low_memory_short_io
    data_source:
      type: synthetic
      generated_shape: "800 rows x 4 columns at dry-run scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: light_visual_aggregation
    category: light
    coverage_tags:
      - light.visualization
      - light.aggregation
    description: "Generate values, bucket them into histogram-like bins, and report summary statistics."
    intent: "Make a quick lightweight chart and aggregate a small sample."
    dataset_size_hint_gb: 0.08
    code_context_hints:
      - "import matplotlib.pyplot as plt"
      - "df.groupby('bucket').size().plot(kind='bar')"
    deterministic_seed: 1103
    workload:
      script: benchmarks/workload_runner.py
      operation: visual_aggregation
      scale: tiny
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - light_visual_aggregation
        - --scale
        - tiny
        - --seed
        - "1103"
    timeout_seconds: 30
    expected_acceptable_profiles:
      - small
      - medium
    expected_recommender_profiles:
      - small
    expected_classification_reason: "Visualization and aggregation are present, but the declared data size is well below the Medium dataset threshold."
    expected_pressure_type: low_cpu_low_memory
    data_source:
      type: synthetic
      generated_shape: "2,400 numeric values at dry-run scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: data_pandas_read_transform
    category: data_processing
    coverage_tags:
      - data_processing.pandas_read_transform
      - threshold.medium_dataset_signal
    description: "Dataframe-style read, filter, and transform over generated tabular rows."
    intent: "Read a medium CSV with pandas and clean columns before analysis."
    dataset_size_hint_gb: 0.8
    code_context_hints:
      - "import pandas as pd"
      - "df = pd.read_csv('events.csv')"
      - "df.assign(score=df.a + df.b).query('score > 0.65')"
    deterministic_seed: 2101
    workload:
      script: benchmarks/workload_runner.py
      operation: read_transform
      scale: small
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - data_pandas_read_transform
        - --scale
        - small
        - --seed
        - "2101"
    timeout_seconds: 45
    expected_acceptable_profiles:
      - medium
      - large
    expected_recommender_profiles:
      - medium
    expected_classification_reason: "Dataset size is above 0.5GB and pandas/dataframe context is explicit, making Small under-represent the request."
    expected_pressure_type: moderate_memory_tabular
    data_source:
      type: synthetic
      generated_shape: "18,000 rows x 6 features at nominal scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: data_dataframe_join_medium
    category: data_processing
    coverage_tags:
      - data_processing.dataframe_join
      - context.join_signal
    description: "Join generated left and right tables on a deterministic key and aggregate the joined values."
    intent: "Join two dataframes and compute summary features."
    dataset_size_hint_gb: 1.2
    code_context_hints:
      - "left.merge(right, on='user_id')"
      - "joined.groupby('segment').agg({'value': 'sum'})"
    deterministic_seed: 2102
    workload:
      script: benchmarks/workload_runner.py
      operation: join
      scale: small
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - data_dataframe_join_medium
        - --scale
        - small
        - --seed
        - "2102"
    timeout_seconds: 45
    expected_acceptable_profiles:
      - medium
      - large
    expected_recommender_profiles:
      - medium
    expected_classification_reason: "A join can use more memory than a scan; Medium is acceptable for the nominal shape, while Large is acceptable as a conservative choice."
    expected_pressure_type: moderate_memory_join
    data_source:
      type: synthetic
      generated_shape: "16,000 left rows and 5,333 right rows at nominal scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: data_large_aggregation
    category: data_processing
    coverage_tags:
      - data_processing.increasing_dataset_sizes
      - threshold.large_dataset_signal
    description: "Group and aggregate generated rows at a dataset-size hint above the Large signal threshold."
    intent: "Aggregate a larger CSV and compare group-level totals."
    dataset_size_hint_gb: 2.2
    code_context_hints:
      - "import pandas as pd"
      - "df.groupby(['region', 'segment']).agg({'amount': 'sum'})"
    deterministic_seed: 2103
    workload:
      script: benchmarks/workload_runner.py
      operation: aggregation
      scale: small
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - data_large_aggregation
        - --scale
        - small
        - --seed
        - "2103"
    timeout_seconds: 60
    expected_acceptable_profiles:
      - large
    expected_recommender_profiles:
      - large
    expected_classification_reason: "Dataset-size hint is above 2GB and data-processing context is explicit."
    expected_pressure_type: high_memory_groupby
    data_source:
      type: synthetic
      generated_shape: "30,000 rows x 8 features with 96 groups at nominal scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: ml_sklearn_fit_small
    category: machine_learning
    coverage_tags:
      - machine_learning.sklearn_fit_small
      - intent.training_signal
    description: "Small scikit-learn-style estimator fit represented by deterministic logistic updates."
    intent: "Fit a small scikit-learn classifier on a toy generated dataset."
    dataset_size_hint_gb: 0.2
    code_context_hints:
      - "from sklearn.linear_model import LogisticRegression"
      - "model.fit(X_train, y_train)"
    deterministic_seed: 3101
    workload:
      script: benchmarks/workload_runner.py
      operation: ml_fit
      scale: tiny
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - ml_sklearn_fit_small
        - --scale
        - tiny
        - --seed
        - "3101"
    timeout_seconds: 45
    expected_acceptable_profiles:
      - medium
      - large
    expected_recommender_profiles:
      - medium
    expected_classification_reason: "Training context alone is enough for Medium in the current rules; Large is operationally acceptable but not required."
    expected_pressure_type: moderate_cpu_training
    data_source:
      type: synthetic
      generated_shape: "2,500 rows x 8 features at nominal scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: ml_sklearn_fit_medium
    category: machine_learning
    coverage_tags:
      - machine_learning.sklearn_fit_medium
      - threshold.training_plus_medium_dataset
    description: "Medium generated feature matrix with scikit-learn-style fit signals."
    intent: "Train a scikit-learn model on a medium CSV-like dataset."
    dataset_size_hint_gb: 1.4
    code_context_hints:
      - "import pandas as pd"
      - "from sklearn.ensemble import RandomForestClassifier"
      - "model.fit(X, y)"
    deterministic_seed: 3102
    workload:
      script: benchmarks/workload_runner.py
      operation: ml_fit
      scale: small
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - ml_sklearn_fit_medium
        - --scale
        - small
        - --seed
        - "3102"
    timeout_seconds: 60
    expected_acceptable_profiles:
      - large
    expected_recommender_profiles:
      - large
    expected_classification_reason: "Training, pandas/dataframe context, and a dataset-size hint above 0.5GB combine to the Large score band."
    expected_pressure_type: high_cpu_moderate_memory_training
    data_source:
      type: synthetic
      generated_shape: "7,500 rows x 16 features at nominal scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: ml_sklearn_fit_memory_pressure
    category: machine_learning
    coverage_tags:
      - machine_learning.sklearn_fit_larger_data
      - machine_learning.memory_pressure
    description: "Larger generated fit with bounded scratch allocation to create meaningful memory pressure."
    intent: "Train a larger scikit-learn model where feature construction may need more memory."
    dataset_size_hint_gb: 2.4
    code_context_hints:
      - "import pandas as pd"
      - "from sklearn.preprocessing import OneHotEncoder"
      - "model.fit(X_train, y_train)"
    deterministic_seed: 3103
    workload:
      script: benchmarks/workload_runner.py
      operation: ml_fit
      scale: memory_pressure
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - ml_sklearn_fit_memory_pressure
        - --scale
        - memory_pressure
        - --seed
        - "3103"
    timeout_seconds: 90
    expected_acceptable_profiles:
      - large
    expected_recommender_profiles:
      - large
    expected_classification_reason: "Dataset-size hint is above 2GB, training context is explicit, and the workload intentionally allocates bounded scratch memory."
    expected_pressure_type: high_memory_training
    data_source:
      type: synthetic
      generated_shape: "14,000 rows x 32 features plus 192MiB bounded scratch at nominal scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: boundary_below_0_5_ambiguous
    category: boundary
    coverage_tags:
      - boundary.below_0_5gb
      - boundary.ambiguous_incomplete_intent
    description: "Immediately below the 0.5GB dataset threshold with incomplete intent and weak code context."
    intent: "Maybe inspect something briefly; I am not sure yet."
    dataset_size_hint_gb: 0.49
    code_context_hints:
      - "# no imports yet"
      - "values = []"
    deterministic_seed: 4101
    workload:
      script: benchmarks/workload_runner.py
      operation: basic_python
      scale: boundary_below
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - boundary_below_0_5_ambiguous
        - --scale
        - boundary_below
        - --seed
        - "4101"
    timeout_seconds: 30
    expected_acceptable_profiles:
      - small
      - medium
    expected_recommender_profiles:
      - small
    expected_classification_reason: "The hint is just below the Medium dataset threshold; Small is expected from strict rules, while Medium is acceptable for operator caution."
    expected_pressure_type: boundary_low_signal
    data_source:
      type: synthetic
      generated_shape: "16,200 numeric values at boundary scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: boundary_above_0_5_conflicting
    category: conflicting_signal
    coverage_tags:
      - boundary.above_0_5gb
      - conflicting_signal.strong_intent_weak_context
      - conflicting_signal.misleading_dataset_size_hint
    description: "Just above the 0.5GB threshold with strong training intent but little code context and an intentionally uncertain dataset-size hint."
    intent: "Train a model if the data turns out to be useful."
    dataset_size_hint_gb: 0.51
    code_context_hints:
      - "# sketch only; no imports pasted"
      - "model = None"
    deterministic_seed: 5101
    workload:
      script: benchmarks/workload_runner.py
      operation: ml_fit
      scale: boundary_above
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - boundary_above_0_5_conflicting
        - --scale
        - boundary_above
        - --seed
        - "5101"
    timeout_seconds: 45
    expected_acceptable_profiles:
      - medium
      - large
    expected_recommender_profiles:
      - large
    expected_classification_reason: "Training intent and a just-above-threshold dataset hint make Medium or Large acceptable depending on how conservative the evaluator is."
    expected_pressure_type: conflicting_intent_context
    data_source:
      type: synthetic
      generated_shape: "4,400 rows x 10 features at boundary scale"
    license: "Synthetic data generated by repository code; no external license applies."

  - workload_id: policy_gpu_disallowed
    category: policy
    coverage_tags:
      - policy.gpu_unavailable_or_disallowed
      - policy.recommended_profile_outside_allowed_policy
      - conflicting_signal.harmless_intent_strong_code_context
    description: "Harmless natural-language request with strong GPU/deep-learning code signals, evaluated under a policy that disallows GPU and Large profiles."
    intent: "Just checking a tiny example; please keep the session lightweight."
    dataset_size_hint_gb: 0.03
    code_context_hints:
      - "import torch"
      - "model.cuda()"
      - "trainer.fit(model)"
    deterministic_seed: 6101
    workload:
      script: benchmarks/workload_runner.py
      operation: policy_check
      scale: tiny
      command:
        - python3
        - -m
        - benchmarks.workload_runner
        - --workload-id
        - policy_gpu_disallowed
        - --scale
        - tiny
        - --seed
        - "6101"
    timeout_seconds: 30
    expected_acceptable_profiles:
      - medium
    expected_recommender_profiles:
      - gpu_or_large
    expected_classification_reason: "Raw context-aware recommendation should detect GPU/deep-learning signals, but this scenario tests policy fallback when GPU and Large are unavailable."
    expected_pressure_type: policy_fallback
    policy_constraints:
      gpu_available: false
      disallowed_profiles:
        - gpu_or_large
        - large
      allowed_profiles:
        - small
        - medium
      expected_policy_action: "downgrade_or_require_manual_review_to_medium"
    data_source:
      type: synthetic
      generated_shape: "1,000-row policy probe at nominal scale; no GPU operation is executed"
    license: "Synthetic data generated by repository code; no external license applies."
